<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Durachok Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; background: #000; color: #fff; padding: 20px; text-align: center; }
    h1 { font-size: 28px; margin-bottom: 30px; }
    .days { font-size: 64px; font-weight: bold; color: #0f0; }
    .achievement { font-size: 24px; margin: 20px 0; }
    button { background: #0088cc; color: white; border: none; padding: 15px 30px; border-radius: 12px; font-size: 18px; margin-top: 30px; }
  </style>
</head>
<body>
  <h1>🔥 DURACHOK PRO 🔥</h1>
  <div class="days" id="days">0 дней</div>
  <div id="achievements"></div>
  <button onclick="Telegram.WebApp.close()">✖ Закрыть</button>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const userId = Telegram.WebApp.initDataUnsafe.user?.id;
    if (!userId) {
      document.body.innerHTML = "<h1>Запускай из бота, брат</h1>";
    }

    // Здесь будет запрос к боту за данными (через bot API или webhook)
    // Пока просто пример
    document.getElementById("days").innerText = "27 дней";
    document.getElementById("achievements").innerHTML = `
      <div class="achievement">🥇 ГЕРОЙ — 14 дней</div>
      <div class="achievement">🛡 ВОИН — 21 день</div>
      <div class="achievement">Следующее: 🗡 МАСТЕР — через 3 дня</div>
    `;
  </script>
</body>
</html>
