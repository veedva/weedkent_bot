<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAGE SMASHER | Гнев под контролем</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    
    .container {
      max-width: 500px;
      width: 100%;
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #ff4757;
    }
    
    .subtitle {
      color: #888;
      margin-bottom: 30px;
      font-size: 16px;
    }
    
    #counter {
      font-size: 72px;
      font-weight: bold;
      color: #ff4757;
      margin: 20px 0;
      text-shadow: 0 0 20px rgba(255, 71, 87, 0.7);
    }
    
    .counter-label {
      font-size: 18px;
      color: #aaa;
      margin-bottom: 30px;
    }
    
    #rage-button {
      width: 200px;
      height: 200px;
      background: radial-gradient(circle, #ff4757 0%, #c23636 100%);
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      margin: 30px 0;
      transition: transform 0.1s;
      box-shadow: 0 0 30px rgba(255, 71, 87, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    #rage-button:active {
      transform: scale(0.95);
      box-shadow: 0 0 50px rgba(255, 71, 87, 0.8);
    }
    
    .button-effect {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 30%, rgba(255, 255, 255, 0.2) 70%);
      opacity: 0;
      border-radius: 50%;
    }
    
    .message {
      background: rgba(255, 71, 87, 0.1);
      border-radius: 15px;
      padding: 15px;
      margin: 20px 0;
      border: 1px solid rgba(255, 71, 87, 0.3);
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    #message {
      font-size: 18px;
      color: #ffcc00;
    }
    
    .stats {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin: 20px 0;
      background: rgba(255, 255, 255, 0.05);
      padding: 15px;
      border-radius: 15px;
    }
    
    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .stat-value {
      font-size: 20px;
      font-weight: bold;
      color: #00d2d3;
    }
    
    .stat-label {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }
    
    .close-btn {
      background: #333;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }
    
    .close-btn:hover {
      background: #444;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤬 RAGE SMASHER</h1>
    <div class="subtitle">Бей кнопку пока не отпустит</div>
    
    <div id="counter">0</div>
    <div class="counter-label">ударов по гневу</div>
    
    <button id="rage-button">
      БЕЙ!
      <div class="button-effect" id="buttonEffect"></div>
    </button>
    
    <div class="message">
      <div id="message">Нажми кнопку чтобы выпустить пар</div>
    </div>
    
    <div class="stats">
      <div class="stat">
        <div class="stat-value" id="cps">0</div>
        <div class="stat-label">удар/сек</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="streak">0</div>
        <div class="stat-label">серия</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="maxStreak">0</div>
        <div class="stat-label">рекорд</div>
      </div>
    </div>
    
    <button class="close-btn" onclick="Telegram.WebApp.close()">✖ ЗАКРЫТЬ</button>
  </div>

  <script>
    // Telegram WebApp
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    Telegram.WebApp.BackButton.show();
    Telegram.WebApp.BackButton.onClick(() => {
      Telegram.WebApp.close();
    });
    
    // Игровая логика
    let clicks = 0;
    let streak = 0;
    let maxStreak = 0;
    let clickTimes = [];
    const messages = [
      "Нажми кнопку чтобы выпустить пар",
      "Давай сильнее!",
      "🔥 Ты в ярости!",
      "💢 Выпускай всю злость!",
      "⚡ МОЩНО! Продолжай!",
      "🌪 Ты сносишь гнев!",
      "💥 АТОМНЫЙ УДАР!",
      "🚀 КОСМИЧЕСКАЯ ЯРОСТЬ!",
      "☄️ ТЫ - БУРЯ!",
      "👑 КОРОЛЬ КОНТРОЛЯ ГНЕВА!"
    ];
    
    const counter = document.getElementById('counter');
    const rageButton = document.getElementById('rage-button');
    const message = document.getElementById('message');
    const cpsElement = document.getElementById('cps');
    const streakElement = document.getElementById('streak');
    const maxStreakElement = document.getElementById('maxStreak');
    const buttonEffect = document.getElementById('buttonEffect');
    
    function handleClick() {
      clicks++;
      streak++;
      
      if (streak > maxStreak) {
        maxStreak = streak;
      }
      
      counter.textContent = clicks;
      streakElement.textContent = streak;
      maxStreakElement.textContent = maxStreak;
      
      // Эффект клика
      buttonEffect.style.opacity = '1';
      buttonEffect.style.transform = 'scale(1.5)';
      setTimeout(() => {
        buttonEffect.style.opacity = '0';
        buttonEffect.style.transform = 'scale(1)';
      }, 200);
      
      // Вибрация
      if (navigator.vibrate) navigator.vibrate(50);
      
      // Меняем цвет
      const hue = (clicks * 10) % 360;
      rageButton.style.background = `radial-gradient(circle, hsl(${hue}, 100%, 60%) 0%, hsl(${hue}, 100%, 40%) 100%)`;
      
      // Меняем сообщение
      const msgIndex = Math.min(Math.floor(clicks / 10), messages.length - 1);
      message.textContent = messages[msgIndex];
      
      // Обновляем CPS
      const now = Date.now();
      clickTimes.push(now);
      clickTimes = clickTimes.filter(time => now - time < 1000);
      cpsElement.textContent = clickTimes.length;
      
      // Сброс серии через 2 секунды
      clearTimeout(window.streakTimeout);
      window.streakTimeout = setTimeout(() => {
        streak = 0;
        streakElement.textContent = streak;
      }, 2000);
    }
    
    rageButton.addEventListener('click', handleClick);
    
    // Авто-кликер для демо (можно удалить)
    // setInterval(() => {
    //   if (Math.random() > 0.8) {
    //     handleClick();
    //   }
    // }, 100);
  </script>
</body>
</html>
