<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@weedkent_bot — Прогресс</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 15px; }
    h1 { text-align: center; font-size: 22px; margin: 10px 0 20px; }
    .stat { text-align: center; font-size: 52px; margin: 15px 0; font-weight: bold; }
    .best { font-size: 28px; color: #0f0; }
    .chart { height: 280px; margin: 30px 0; }
    .achievements { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin: 30px 0; }
    .ach { background: #111; padding: 15px; border-radius: 15px; text-align: center; border: 2px solid #333; transition: all 0.3s; }
    .ach.unlocked { border-color: #0f0; box-shadow: 0 0 20px rgba(0,255,0,0.4); transform: scale(1.05); }
    .ach .emoji { font-size: 42px; margin-bottom: 8px; }
    .ach .title { font-weight: bold; font-size: 16px; }
    .close { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0088cc; padding: 14px 50px; border-radius: 30px; font-size: 18px; }
  </style>
</head>
<body>
  <h1>🔥 @weedkent_bot</h1>
  <div class="stat" id="days">Загрузка...</div>
  <div class="stat best" id="best">Лучший: Загрузка...</div>
  <div class="stat" id="dopamine">Дофамин: Загрузка...</div>

  <div class="chart"><canvas id="chart"></canvas></div>

  <h2 style="text-align:center; margin:30px 0 15px;">🏆 Достижения</h2>
  <div class="achievements" id="achievements">Загрузка...</div>

  <button class="close" onclick="Telegram.WebApp.close()">✖ Закрыть</button>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const userId = Telegram.WebApp.initDataUnsafe.user.id;

    // ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←
    // РЕАЛЬНЫЕ ДАННЫЕ ИЗ БОТА
    fetch(`https://твой-бот.up.railway.app/user/${userId}`)
      .then(r => r.json())
      .then(data => render(data))
      .catch(() => document.body.innerHTML = "<h1 style='text-align:center;margin-top:50%'>Ошибка загрузки</h1>");
    // ←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←←

    function render(data) {
      document.getElementById("days").innerText = `${data.days} ${decline(data.days)}`;
      document.getElementById("best").innerText = `Лучший: ${data.best} ${decline(data.best)}`;
      document.getElementById("dopamine").innerText = `Дофамин ~${data.dopamine}%`;

      // График
      new Chart(document.getElementById("chart"), {
        type: "line",
        data: {
          labels: ["0", "3", "7", "14", "21", "30", "60", "90"],
          datasets: [{
            label: "Дофамин",
            data: [5, 12, 28, 45, 70, 85, 95, 99],
            borderColor: "#0f0",
            backgroundColor: "rgba(0,255,0,0.1)",
            tension: 0.4,
            fill: true
          }]
        },
        options: { plugins: { legend: { display: false } } }
      });

      // Ачивки
      const achs = [
        {d:1,e:"⛓️‍💥",t:"НОВИЧОК"},{d:3,e:"🥉",t:"ВЫЖИВШИЙ"},{d:7,e:"🥈",t:"БОЕЦ"},
        {d:14,e:"🥇",t:"ГЕРОЙ"},{d:21,e:"🛡",t:"ВОИН"},{d:30,e:"🗡",t:"МАСТЕР"},
        {d:60,e:"⚔️",t:"ВЕДЬМАК"},{d:90,e:"✨",t:"УМНИЧКА"},{d:180,e:"🎖",t:"ПОЛУБОГ"},
        {d:365,e:"🏆",t:"ТЫ ЗДОРОВ"}
      ];

      const container = document.getElementById("achievements");
      achs.forEach(a => {
        const div = document.createElement("div");
        div.className = "ach" + (data.days >= a.d ? " unlocked" : "");
        div.innerHTML = `<div class="emoji">${a.e}</div><div class="title">${a.t}</div><div class="day">День ${a.d}</div>`;
        container.appendChild(div);
      });
    }

    function decline(n) {
      if (n % 10 === 1 && n % 100 !== 11) return "день";
      if ([2,3,4].includes(n % 10) && ![12,13,14].includes(n % 100)) return "дня";
      return "дней";
    }
  </script>
</body>
</html>
