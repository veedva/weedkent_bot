<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤬 БЕСКОНЕЧНЫЙ КАТАРСИС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      touch-action: manipulation !important;
      outline: none !important;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      width: 100vw;
    }
    
    /* ЭКРАН ДЛЯ ТАПОВ */
    .tap-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 1;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      display: block !important;
    }
    
    /* ТЕКСТ ИНСТРУКЦИИ */
    .instruction {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 18px;
      color: #888;
      z-index: 10;
      padding: 0 20px;
      pointer-events: none;
    }
    
    /* УРОВЕНЬ ЯРОСТИ */
    .rage-level {
      position: absolute;
      top: 80px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      z-index: 10;
      color: #ffcc00;
      text-shadow: 0 0 15px #ffcc00;
      pointer-events: none;
    }
    
    /* ПРОГРЕСС БАР */
    .progress-container {
      position: absolute;
      bottom: 100px;
      left: 30px;
      right: 30px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff4757, #ffcc00);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 4px;
    }
    
    /* КНОПКА ВЫХОДА */
    .exit-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 35px;
      border-radius: 25px;
      font-size: 17px;
      z-index: 10;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-appearance: none;
      border: none;
    }
    
    /* ВЫЛЕТАЮЩИЕ ЭЛЕМЕНТЫ */
    .rage-particle {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      font-weight: 900;
      animation: particleFloat 2.5s ease-out forwards;
      text-shadow: 0 0 10px currentColor;
    }
    
    .rage-word {
      font-size: 36px;
      font-family: 'Arial Black', Impact, sans-serif;
    }
    
    .rage-emoji {
      font-size: 52px;
    }
    
    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.9) rotate(0deg);
      }
      30% {
        opacity: 1;
        transform: translate(var(--dx), var(--dy)) scale(1.8) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.3), calc(var(--dy) * 1.3)) scale(0.4) rotate(calc(var(--rot) * 1.5));
      }
    }
    
    /* ВСПЫШКА */
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 71, 87, 0.2);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: quickFlash 0.3s ease-out;
    }
    
    @keyframes quickFlash {
      0% { opacity: 0.6; }
      100% { opacity: 0; }
    }
    
    /* ПУЛЬСАЦИЯ ВОКРУГ ТАПА */
    .tap-ripple {
      position: absolute;
      border-radius: 50%;
      border: 3px solid rgba(255, 71, 87, 0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      animation: rippleEffect 0.8s ease-out;
    }
    
    @keyframes rippleEffect {
      0% {
        opacity: 0.8;
        transform: scale(0.3);
        border-width: 8px;
      }
      100% {
        opacity: 0;
        transform: scale(2);
        border-width: 1px;
      }
    }
    
    /* ИНДИКАТОР ЗВУКА (только на время инициализации) */
    .sound-indicator {
      position: absolute;
      bottom: 100px;
      right: 20px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      animation: soundInit 2s ease-out forwards;
    }
    
    @keyframes soundInit {
      0% { opacity: 0.8; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(0); display: none; }
    }
  </style>
</head>
<body>
  <div class="instruction">ТАПАЙ ВЕЗДЕ → ВЫПУСТИ ПАР</div>
  <div class="rage-level" id="rageLevel">😐 СПОКОЙНО</div>
  
  <div class="tap-area" id="tapArea"></div>
  
  <!-- Индикатор инициализации звука (показывается только при первом тапе) -->
  <div class="sound-indicator" id="soundIndicator">🎵</div>
  
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  
  <button class="exit-btn" onclick="Telegram.WebApp.close()">✖ ВЫЙТИ</button>

  <!-- АУДИО ЭЛЕМЕНТЫ ДЛЯ ЗВУКОВ -->
  <audio id="initSound" preload="auto" style="display: none;"></audio>

  <script>
    // =================== ТЕЛЕГРАМ ===================
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    if (Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
    }
    
    // =================== ДАННЫЕ ===================
    let rage = 0;
    let lastTapTime = 0;
    let activeParticles = 0;
    const MAX_PARTICLES = 15;
    let soundEnabled = false; // Изначально выключен
    let soundInitialized = false; // Флаг инициализации звука
    let soundCooldown = false;
    let audioElements = [];
    let currentAudioIndex = 0;
    let firstTapDone = false;
    
    // Уровни ярости
    const LEVELS = [
      { emoji: "😐", name: "СПОКОЙНО", color: "#4dabf7" },
      { emoji: "😠", name: "НАПРЯЖЕНИЕ", color: "#ffa94d" },
      { emoji: "😡", name: "ЗЛОСТЬ", color: "#ff6b6b" },
      { emoji: "🤬", name: "ЯРОСТЬ", color: "#ff4757" },
      { emoji: "💥", name: "БЕШЕНСТВО", color: "#ffcc00" },
      { emoji: "🔥", name: "ИСТЕРИКА", color: "#ff3838" }
    ];
    
    // Слова и эмодзи
    const WORDS = ["ПИЗДА", "СУКА", "ЕБАТЬ", "НАХУЙ", "УЁБИЩЕ", "ЗАЛУПА", "БЛЯТЬ", "ХУЙНЯ"];
    const EMOJIS = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡"];
    
    // =================== DOM ===================
    const tapArea = document.getElementById('tapArea');
    const rageLevelEl = document.getElementById('rageLevel');
    const progressBar = document.getElementById('progressBar');
    const soundIndicator = document.getElementById('soundIndicator');
    const initSound = document.getElementById('initSound');
    
    // =================== ЗВУК ===================
    // Инициализация звуковой системы
    function initSoundSystem() {
      if (soundInitialized) return;
      
      console.log("Инициализация звуковой системы...");
      
      // Загружаем звуковой файл
      initSound.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
      initSound.volume = 0.7;
      initSound.preload = "auto";
      
      // Создаём пул аудио элементов
      for (let i = 0; i < 3; i++) {
        const audio = new Audio();
        audio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
        audio.preload = "auto";
        audio.volume = 0.7;
        audioElements.push(audio);
      }
      
      soundInitialized = true;
      console.log("Звуковая система готова");
    }
    
    // Первое включение звука (при первом тапе)
    function enableSoundOnFirstTap() {
      if (soundEnabled) return;
      
      console.log("Включение звука при первом тапе...");
      
      // Показываем индикатор
      soundIndicator.style.display = 'flex';
      setTimeout(() => {
        soundIndicator.style.display = 'none';
      }, 2000);
      
      // Пытаемся проиграть тестовый звук
      try {
        initSound.currentTime = 0;
        initSound.volume = 0.5;
        
        const playPromise = initSound.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              console.log("Звук успешно включен");
              soundEnabled = true;
            })
            .catch(error => {
              console.log("Автовоспроизведение заблокировано, но звук включён");
              soundEnabled = true; // Все равно включаем, будет работать с задержкой
            });
        }
      } catch (error) {
        console.log("Ошибка инициализации звука:", error);
        soundEnabled = true; // Все равно продолжаем
      }
    }
    
    // Проигрывание звука урона
    function playDamageSound() {
      if (!soundEnabled || soundCooldown || Math.random() > 0.25) return;
      
      try {
        // Берём следующий аудио элемент
        const audio = audioElements[currentAudioIndex];
        currentAudioIndex = (currentAudioIndex + 1) % audioElements.length;
        
        // Перематываем и играем
        audio.currentTime = 0;
        audio.volume = 0.7;
        
        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            // Игнорируем ошибки автовоспроизведения
          });
        }
        
        // Кулдаун на звук
        soundCooldown = true;
        setTimeout(() => { soundCooldown = false; }, 400);
        
      } catch (error) {
        // Игнорируем ошибки
      }
    }
    
    // =================== ОСНОВНЫЕ ФУНКЦИИ ===================
    function getCurrentLevel() {
      const index = Math.floor(rage / 20);
      return LEVELS[Math.min(index, LEVELS.length - 1)];
    }
    
    function updateUI() {
      const level = getCurrentLevel();
      rageLevelEl.textContent = `${level.emoji} ${level.name}`;
      rageLevelEl.style.color = level.color;
      rageLevelEl.style.textShadow = `0 0 15px ${level.color}`;
      progressBar.style.width = `${rage}%`;
      progressBar.style.background = level.color;
    }
    
    function createParticle(x, y, isEmoji) {
      if (activeParticles >= MAX_PARTICLES) return;
      
      activeParticles++;
      
      const particle = document.createElement('div');
      particle.className = `rage-particle ${isEmoji ? 'rage-emoji' : 'rage-word'}`;
      particle.textContent = isEmoji 
        ? EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
        : WORDS[Math.floor(Math.random() * WORDS.length)];
      
      const angle = Math.random() * Math.PI * 2;
      const distance = 80 + Math.random() * 120 * (rage / 100);
      particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
      particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
      particle.style.setProperty('--rot', `${Math.random() * 40 - 20}deg`);
      
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      
      const level = getCurrentLevel();
      particle.style.color = level.color;
      
      document.body.appendChild(particle);
      
      setTimeout(() => {
        particle.remove();
        activeParticles--;
      }, 2500);
    }
    
    function createFlash() {
      const flash = document.createElement('div');
      flash.className = 'screen-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 300);
    }
    
    function createRipple(x, y) {
      const ripple = document.createElement('div');
      ripple.className = 'tap-ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      ripple.style.width = ripple.style.height = `${50 + rage}px`;
      
      const level = getCurrentLevel();
      ripple.style.borderColor = level.color;
      
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 800);
    }
    
    function handleTap(x, y) {
      const now = Date.now();
      const timeDiff = now - lastTapTime;
      lastTapTime = now;
      
      // ПЕРВЫЙ ТАП - включаем звук
      if (!firstTapDone) {
        firstTapDone = true;
        initSoundSystem();
        enableSoundOnFirstTap();
      }
      
      // Увеличиваем ярость
      if (timeDiff < 300) {
        rage = Math.min(rage + 8, 100);
      } else if (timeDiff < 1000) {
        rage = Math.min(rage + 5, 100);
      } else {
        rage = Math.min(rage + 3, 100);
      }
      
      // ЗВУК УРОНА (если включен)
      if (soundEnabled) {
        playDamageSound();
      }
      
      // ВИЗУАЛЬНЫЕ ЭФФЕКТЫ
      createFlash();
      createRipple(x, y);
      
      // Создаём частицы
      const particleCount = Math.floor(1 + (rage / 25));
      
      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          const offsetX = (Math.random() * 100 - 50);
          const offsetY = (Math.random() * 100 - 50);
          
          if (Math.random() > 0.4) {
            createParticle(x + offsetX, y + offsetY, false);
          }
          if (Math.random() > 0.5) {
            createParticle(x + offsetX, y + offsetY, true);
          }
        }, i * 50);
      }
      
      // ВИБРАЦИЯ
      if (navigator.vibrate) {
        const duration = Math.min(30 + rage / 2, 70);
        navigator.vibrate(duration);
      }
      
      updateUI();
    }
    
    function decayRage() {
      if (Date.now() - lastTapTime > 1500 && rage > 0) {
        rage = Math.max(rage - 2, 0);
        updateUI();
      }
    }
    
    // =================== ОБРАБОТЧИКИ ===================
    tapArea.addEventListener('click', function(e) {
      handleTap(e.clientX, e.clientY);
    });
    
    tapArea.addEventListener('touchstart', function(e) {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });
    
    // =================== ИНИЦИАЛИЗАЦИЯ ===================
    // Предварительная загрузка звука при загрузке страницы
    document.addEventListener('DOMContentLoaded', function() {
      // Сразу начинаем загружать звук
      const preloadAudio = new Audio();
      preloadAudio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
      preloadAudio.preload = "auto";
      preloadAudio.load();
      
      updateUI();
      console.log("Катарсис-генератор загружен. Тапни по экрану!");
    });
    
    // Таймер сброса ярости
    setInterval(decayRage, 500);
  </script>
</body>
</html>
