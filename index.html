<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤬 БЕСКОНЕЧНЫЙ КАТАРСИС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Импортируем шрифт Dark Souls */
    @import url('https://fonts.cdnfonts.com/css/optimustime');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      touch-action: manipulation !important;
      outline: none !important;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      width: 100vw;
    }
    
    /* ЭКРАН ДЛЯ ТАПОВ */
    .tap-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 1;
    }
    
    /* УРОВЕНЬ ЯРОСТИ */
    .rage-level {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      z-index: 10;
      color: #ffcc00;
      text-shadow: 0 0 15px #ffcc00;
      pointer-events: none;
    }
    
    /* ПРОГРЕСС БАР */
    .progress-container {
      position: absolute;
      bottom: 90px;
      left: 30px;
      right: 30px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff4757, #ffcc00);
      width: 0%;
      transition: width 0.1s linear;
      border-radius: 4px;
    }
    
    /* КНОПКА ВЫХОДА */
    .exit-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 35px;
      border-radius: 25px;
      font-size: 17px;
      z-index: 10;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-appearance: none;
      border: none;
    }
    
    /* ВЫЛЕТАЮЩИЕ СЛОВА */
    .rage-particle {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      font-weight: 900;
      animation: particleFloat 2.2s ease-out forwards;
      text-shadow: 0 0 15px currentColor, 0 0 30px rgba(255, 255, 255, 0.3);
    }
    
    .rage-word {
      font-size: 38px;
      font-family: 'Arial Black', Impact, sans-serif;
      letter-spacing: 1px;
    }
    
    .rage-emoji {
      font-size: 48px;
    }
    
    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8) rotate(0deg);
      }
      25% {
        opacity: 1;
        transform: translate(var(--dx), var(--dy)) scale(1.8) rotate(var(--rot));
      }
      50% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.5), calc(var(--dy) * 1.5)) scale(0.4) rotate(calc(var(--rot) * 2));
      }
    }
    
    /* ВСПЫШКА */
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 71, 87, 0.25);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: quickFlash 0.3s ease-out;
    }
    
    @keyframes quickFlash {
      0% { opacity: 0.7; }
      100% { opacity: 0; }
    }
    
    /* YOU DIED ЭКРАН - Dark Souls стиль */
    .you-died {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .you-died-text {
      font-family: 'OptimusTime', 'Times New Roman', serif;
      font-size: 82px;
      color: #8B0000;
      text-shadow: 
        0 0 20px #8B0000,
        0 0 40px #8B0000,
        0 0 60px #8B0000,
        2px 2px 0 #000,
        4px 4px 0 rgba(0, 0, 0, 0.8);
      margin-bottom: 20px;
      animation: darkSoulsAppear 2.5s ease-out forwards;
      text-transform: uppercase;
      letter-spacing: 10px;
      opacity: 0;
    }
    
    .you-died-subtext {
      font-family: 'OptimusTime', 'Times New Roman', serif;
      font-size: 28px;
      color: #D4AF37;
      text-align: center;
      max-width: 80%;
      opacity: 0;
      animation: subtitleAppear 2.5s ease-out forwards;
      animation-delay: 0.5s;
      text-shadow: 2px 2px 0 #000;
    }
    
    @keyframes darkSoulsAppear {
      0% { 
        opacity: 0;
        transform: scale(0.5) translateY(-50px);
        filter: blur(10px);
      }
      20% {
        opacity: 1;
        transform: scale(1.1) translateY(0);
        filter: blur(0);
      }
      30% {
        transform: scale(1);
      }
      80% {
        opacity: 1;
        transform: scale(1);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes subtitleAppear {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    
    /* КРИТИЧЕСКАЯ ВСПЫШКА */
    .critical-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #8B0000;
      opacity: 0;
      pointer-events: none;
      z-index: 900;
      animation: criticalFlash 1.2s ease-out;
    }
    
    @keyframes criticalFlash {
      0% { opacity: 0.9; }
      30% { opacity: 0.7; }
      70% { opacity: 0.3; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="rage-level" id="rageLevel">😐 СПОКОЙНО</div>
  
  <div class="tap-area" id="tapArea"></div>
  
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  
  <button class="exit-btn" onclick="Telegram.WebApp.close()">✖ ВЫЙТИ</button>
  
  <!-- YOU DIED ЭКРАН Dark Souls стиль -->
  <div class="you-died" id="youDied">
    <div class="you-died-text">YOU DIED</div>
    <div class="you-died-subtext">Твоя ярость достигла апокалиптического уровня</div>
  </div>

  <script>
    // =================== ТЕЛЕГРАМ ===================
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    if (Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
    }
    
    // =================== ДАННЫЕ ===================
    let rage = 0;
    let lastTapTime = 0;
    let activeParticles = 0;
    const MAX_PARTICLES = 12;
    let soundEnabled = false;
    let soundInitialized = false;
    let soundCooldown = false;
    let audioElements = [];
    let youDiedSound = null;
    let currentAudioIndex = 0;
    let firstTapDone = false;
    let youDiedShown = false;
    let decayTimer = null;
    
    // Уровни ярости - ПРОЩЕ!
    const LEVELS = [
      { emoji: "😐", name: "СПОКОЙНО", color: "#4dabf7", soundChance: 0.1 },
      { emoji: "😠", name: "НАПРЯЖЕНИЕ", color: "#ffa94d", soundChance: 0.15 },
      { emoji: "😡", name: "ЗЛОСТЬ", color: "#ff6b6b", soundChance: 0.2 },
      { emoji: "🤬", name: "ЯРОСТЬ", color: "#ff4757", soundChance: 0.25 },
      { emoji: "💥", name: "БЕШЕНСТВО", color: "#ffcc00", soundChance: 0.3 },
      { emoji: "🔥", name: "ИСТЕРИКА", color: "#ff3838", soundChance: 0.35 }
    ];
    
    // Слова и эмодзи
    const WORDS = [
      "ПИЗДА!", "СУКА!", "ЕБАТЬ!", "НАХУЙ!", "БЛЯТЬ!", "ХУЙНЯ!", 
      "ЁБАНЫЙ!", "ОХУЕТЬ!", "ЗАЕБАЛО!", "ПОШЛО НАХУЙ!", "ЁПТА!", 
      "БЛЯДЬ!", "ХУЁВО!", "ЕБЁНЫЙ!", "ПИЗДЕЦ!", "ВЪЕБАТЬ!", "ПРОЕБАТЬ!"
    ];
    const EMOJIS = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡", "🌪", "☠️", "💣", "🧨"];
    
    // =================== DOM ===================
    const tapArea = document.getElementById('tapArea');
    const rageLevelEl = document.getElementById('rageLevel');
    const progressBar = document.getElementById('progressBar');
    const youDiedScreen = document.getElementById('youDied');
    
    // =================== ЗВУК ===================
    function initSoundOnFirstTap() {
      if (soundInitialized) return;
      
      // Звуки ударов
      for (let i = 0; i < 2; i++) {
        const audio = new Audio();
        audio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
        audio.preload = "auto";
        audio.volume = 0.5;
        audioElements.push(audio);
      }
      
      // Звук YOU DIED
      youDiedSound = new Audio();
      youDiedSound.src = "https://veedva.github.io/weedkent_bot/dark-souls-you-died.mp3";
      youDiedSound.preload = "auto";
      youDiedSound.volume = 0.7;
      
      soundInitialized = true;
      soundEnabled = true;
      
      // Предзагрузка звука
      setTimeout(() => {
        try {
          const testAudio = new Audio();
          testAudio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
          testAudio.volume = 0.03;
          testAudio.play().catch(() => {});
        } catch (e) {}
      }, 100);
    }
    
    function playDamageSound() {
      if (!soundEnabled || soundCooldown) return;
      
      const level = getCurrentLevel();
      if (Math.random() > level.soundChance) return;
      
      try {
        const audio = audioElements[currentAudioIndex];
        currentAudioIndex = (currentAudioIndex + 1) % audioElements.length;
        
        audio.currentTime = 0;
        audio.volume = 0.4 + (rage / 250);
        audio.play().catch(() => {});
        
        soundCooldown = true;
        setTimeout(() => { soundCooldown = false; }, 400);
      } catch (error) {}
    }
    
    function playYouDiedSound() {
      if (!soundEnabled || !youDiedSound) return;
      
      try {
        youDiedSound.currentTime = 0;
        youDiedSound.volume = 0.7;
        youDiedSound.play().catch(() => {});
      } catch (error) {}
    }
    
    // =================== ОСНОВНЫЕ ФУНКЦИИ ===================
    function getCurrentLevel() {
      const index = Math.floor(rage / 20);
      return LEVELS[Math.min(index, LEVELS.length - 1)];
    }
    
    function updateUI() {
      const level = getCurrentLevel();
      rageLevelEl.textContent = `${level.emoji} ${level.name}`;
      rageLevelEl.style.color = level.color;
      rageLevelEl.style.textShadow = `0 0 20px ${level.color}`;
      progressBar.style.width = `${rage}%`;
      progressBar.style.background = `linear-gradient(90deg, ${level.color}, #ffcc00)`;
    }
    
    function createParticle(x, y, isEmoji) {
      if (activeParticles >= MAX_PARTICLES) return;
      
      activeParticles++;
      
      const particle = document.createElement('div');
      particle.className = `rage-particle ${isEmoji ? 'rage-emoji' : 'rage-word'}`;
      particle.textContent = isEmoji 
        ? EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
        : WORDS[Math.floor(Math.random() * WORDS.length)];
      
      const angle = Math.random() * Math.PI * 2;
      const distance = 80 + Math.random() * 140 * (rage / 100);
      particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
      particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
      particle.style.setProperty('--rot', `${Math.random() * 60 - 30}deg`);
      
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      
      const level = getCurrentLevel();
      particle.style.color = level.color;
      
      document.body.appendChild(particle);
      
      setTimeout(() => {
        if (particle.parentNode) {
          particle.remove();
          activeParticles--;
        }
      }, 2200);
    }
    
    function createFlash() {
      const flash = document.createElement('div');
      flash.className = 'screen-flash';
      
      const level = getCurrentLevel();
      flash.style.background = `rgba(${parseInt(level.color.slice(1,3), 16)}, ${parseInt(level.color.slice(3,5), 16)}, ${parseInt(level.color.slice(5,7), 16)}, 0.3)`;
      
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 300);
    }
    
    function createCriticalFlash() {
      const flash = document.createElement('div');
      flash.className = 'critical-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 1200);
    }
    
    function showYouDied() {
      if (youDiedShown) return;
      youDiedShown = true;
      
      // Критическая вспышка
      createCriticalFlash();
      
      // Звук YOU DIED
      playYouDiedSound();
      
      // Вибрация
      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200, 100, 400]);
      }
      
      // Показываем экран через небольшую задержку
      setTimeout(() => {
        youDiedScreen.style.display = 'flex';
        
        // Автоматическое скрытие через 4 секунды
        setTimeout(() => {
          youDiedScreen.style.display = 'none';
          resetGame();
        }, 4000);
      }, 600);
    }
    
    function resetGame() {
      rage = 0;
      youDiedShown = false;
      updateUI();
    }
    
    // СБРОС ЯРОСТИ - МЕДЛЕННЕЕ!
    function startDecay() {
      if (decayTimer) clearTimeout(decayTimer);
      
      decayTimer = setTimeout(() => {
        if (rage > 0) {
          // МЕДЛЕННЫЙ СБРОС - даём время отдохнуть
          const decayRate = 1.5 + (rage / 30); // От 1.5 до 5 единиц в секунду
          rage = Math.max(rage - decayRate, 0);
          updateUI();
          
          if (rage > 0) {
            startDecay();
          }
        }
      }, 100);
    }
    
    function handleTap(x, y) {
      if (!firstTapDone) {
        firstTapDone = true;
        initSoundOnFirstTap();
      }
      
      if (rage >= 100 && !youDiedShown) {
        showYouDied();
        return;
      }
      
      const now = Date.now();
      const timeDiff = now - lastTapTime;
      lastTapTime = now;
      
      // ЛЕГКИЙ РОСТ - можно достичь 100% нормальной скоростью!
      let rageGain = 0;
      
      if (timeDiff < 150) { // Быстро (<150мс) - 10 очков
        rageGain = 10;
      } else if (timeDiff < 300) { // Средне (150-300мс) - 8 очков
        rageGain = 8;
      } else if (timeDiff < 500) { // Медленно (300-500мс) - 6 очков
        rageGain = 6;
      } else { // Очень медленно (>500мс) - 4 очка
        rageGain = 4;
      }
      
      // БОНУС за уровень ярости - чем выше, тем легче расти дальше!
      const levelBonus = Math.floor(rage / 20) * 2;
      rageGain += levelBonus;
      
      // МИНИМАЛЬНЫЙ ГАЙН - даже при одиночных тапах прогресс есть
      rageGain = Math.max(rageGain, 4);
      
      rage = Math.min(rage + rageGain, 100);
      
      // ЗВУК
      playDamageSound();
      
      // ВСПЫШКА
      createFlash();
      
      // ПУЛЬСАЦИЯ
      const ripple = document.createElement('div');
      ripple.className = 'tap-ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      ripple.style.width = ripple.style.height = `${40 + rage}px`;
      
      const level = getCurrentLevel();
      ripple.style.borderColor = level.color;
      
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 1000);
      
      // ВЫЛЕТАЮЩИЕ ЭЛЕМЕНТЫ
      const particleMultiplier = 1 + (rageGain / 5);
      const baseParticles = Math.floor(2 * particleMultiplier);
      const particleCount = Math.min(baseParticles, 6);
      
      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          const offsetX = (Math.random() * 120 - 60);
          const offsetY = (Math.random() * 120 - 60);
          
          if (Math.random() > 0.4) {
            createParticle(x + offsetX, y + offsetY, false);
          }
          if (Math.random() > 0.5) {
            createParticle(x + offsetX, y + offsetY, true);
          }
        }, i * 80);
      }
      
      // ВИБРАЦИЯ - только при высокой ярости
      if (navigator.vibrate && rage > 40) {
        const duration = Math.min(15 + rage / 4, 50);
        navigator.vibrate(duration);
      }
      
      updateUI();
      
      // ЗАПУСКАЕМ СБРОС (медленный)
      startDecay();
    }
    
    // =================== ОБРАБОТЧИКИ ===================
    tapArea.addEventListener('click', function(e) {
      handleTap(e.clientX, e.clientY);
    });
    
    tapArea.addEventListener('touchstart', function(e) {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });
    
    // =================== ИНИЦИАЛИЗАЦИЯ ===================
    updateUI();
  </script>
</body>
</html>
