<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤬 БЕСКОНЕЧНЫЙ КАТАРСИС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      touch-action: manipulation !important;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      width: 100vw;
      -webkit-font-smoothing: antialiased;
    }
    
    /* ЭКРАН ДЛЯ ТАПОВ */
    .tap-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
    
    /* ПРОГРЕСС БАР - ТОЛЬКО ШКАЛА */
    .progress-container {
      position: absolute;
      bottom: 90px;
      left: 30px;
      right: 30px;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .progress-bar {
      height: 100%;
      width: 0%;
      transition: width 0.15s ease-out, background-color 0.3s ease;
      border-radius: 5px;
    }
    
    /* КНОПКА ВЫХОДА */
    .exit-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 35px;
      border-radius: 25px;
      font-size: 17px;
      z-index: 1002;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-appearance: none;
      border: none;
    }
    
    /* КОНТЕЙНЕР ДЛЯ ЧАСТИЦ */
    .particles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
      contain: strict;
    }
    
    /* ВЫЛЕТАЮЩИЕ СЛОВА */
    .rage-particle {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      font-weight: 900;
      animation: particleFloat 1.2s ease-out forwards;
      will-change: transform, opacity;
    }
    
    .rage-word {
      font-family: 'Arial Black', Impact, sans-serif;
      letter-spacing: 1px;
      text-shadow: 0 0 12px currentColor, 0 0 25px rgba(255, 255, 255, 0.3);
    }
    
    .rage-emoji {
      text-shadow: 0 0 16px currentColor, 0 0 32px rgba(255, 255, 255, 0.4);
    }
    
    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.9) rotate(0deg);
      }
      40% {
        opacity: 1;
        transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.2), calc(var(--dy) * 1.2)) scale(0.3);
      }
    }
    
    /* ВСПЫШКА ЭКРАНА */
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: quickFlash 0.25s ease-out;
      will-change: opacity;
    }
    
    @keyframes quickFlash {
      0% { opacity: 0.6; }
      100% { opacity: 0; }
    }
    
    /* ТОЧКА УДАРА */
    .tap-hit {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 4;
      animation: tapHitEffect 0.35s ease-out forwards;
      will-change: transform, opacity;
    }
    
    @keyframes tapHitEffect {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
    }
    
    /* YOU DIED ЭКРАН */
    .you-died-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .you-died-text {
      font-family: 'Times New Roman', serif;
      font-size: 14vw;
      color: #8B0000;
      text-shadow: 
        0 0 30px #8B0000,
        0 0 60px #8B0000,
        0 0 90px #8B0000,
        3px 3px 0 #000,
        5px 5px 0 rgba(0, 0, 0, 0.8);
      margin: 0;
      opacity: 0;
      animation: darkSoulsDeath 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      text-transform: uppercase;
      letter-spacing: 2vw;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      padding: 0 5vw;
      max-width: 100%;
      transform-origin: center center;
    }
    
    @media (max-width: 400px) {
      .you-died-text {
        font-size: 56px;
        letter-spacing: 8px;
      }
    }
    
    @media (min-width: 800px) {
      .you-died-text {
        font-size: 112px;
        letter-spacing: 16px;
      }
    }
    
    @keyframes darkSoulsDeath {
      0% { 
        opacity: 0;
        transform: scale(3);
        filter: blur(50px) brightness(5);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0) brightness(1);
      }
    }
    
    /* КРИТИЧЕСКАЯ ВСПЫШКА */
    .critical-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #8B0000;
      opacity: 0;
      pointer-events: none;
      z-index: 900;
      animation: criticalFlash 1.5s ease-out;
      will-change: opacity;
    }
    
    @keyframes criticalFlash {
      0% { opacity: 0; }
      5% { opacity: 0.8; }
      15% { opacity: 0.7; }
      30% { opacity: 0.5; }
      50% { opacity: 0.3; }
      70% { opacity: 0.15; }
      90% { opacity: 0.05; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Контейнер для частиц -->
  <div class="particles-container" id="particlesContainer"></div>
  
  <!-- Область для тапов -->
  <div class="tap-area" id="tapArea"></div>
  
  <!-- Прогресс-бар (без надписей) -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  
  <!-- Кнопка выхода -->
  <button class="exit-btn" onclick="Telegram.WebApp.close()">✖ ЗАКРЫТЬ</button>
  
  <!-- YOU DIED ЭКРАН -->
  <div class="you-died-overlay" id="youDiedOverlay">
    <div class="you-died-text">YOU DIED</div>
  </div>

  <script>
    // =================== ТЕЛЕГРАМ ===================
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    if (Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
    }
    
    // =================== ДАННЫЕ ===================
    let rage = 0;
    let soundEnabled = false;
    let soundInitialized = false;
    let youDiedSound = null;
    let firstTapDone = false;
    let youDiedShown = false;
    let gameActive = true;
    let isProcessingTap = false;
    let lastTapTime = 0;
    
    // Слова и эмодзи
    const WORDS = [
      "ПИЗДА!", "СУКА!", "ЕБАТЬ!", "НАХУЙ!", "БЛЯТЬ!", "ХУЙ!", 
      "ПИЗДОС!", "ОХУЕТЬ!", "ЗАЕБАЛО!", "ПОШЛИ НАХУЙ!", "ЁПТА!", 
      "БЛЯДЬ!", "УЁБИЩЕ!", "ТВАРЬ!", "ПИЗДЕЦ!", "ЗАЛУПА!", "МРАЗЬ!"
    ];
    const EMOJIS = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡", "🌪", "☠️", "💣", "🧨"];
    
    // ЦВЕТА ДЛЯ ПРОГРЕСС-БАРА (от холодных к горячим)
    const PROGRESS_COLORS = [
      '#4dabf7',   // Холодный синий (0-20%)
      '#38bdf8',   // Голубой (20-40%)
      '#22d3ee',   // Бирюзовый (40-50%)
      '#fbbf24',   // Теплый желтый (50-60%)
      '#f97316',   // Оранжевый (60-80%)
      '#ef4444',   // Красный (80-90%)
      '#dc2626',   // Ярко-красный (90-95%)
      '#991b1b'    // Темно-красный (95-100%)
    ];
    
    // =================== DOM ===================
    const tapArea = document.getElementById('tapArea');
    const progressBar = document.getElementById('progressBar');
    const youDiedOverlay = document.getElementById('youDiedOverlay');
    const particlesContainer = document.getElementById('particlesContainer');
    
    // =================== ЗВУК ===================
    // ОДИН АУДИОЭЛЕМЕНТ ДЛЯ ВСЕХ ЗВУКОВ - НЕТ НАЛОЖЕНИЙ
    let currentAudio = null;
    let damageAudio = null;
    
    function initSoundOnFirstTap() {
      if (soundInitialized) return;
      
      // Аудио для ударов
      damageAudio = new Audio();
      damageAudio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
      damageAudio.preload = "auto";
      damageAudio.volume = 0.3;
      
      // Аудио для смерти - ИСПРАВЛЕННЫЙ URL
      youDiedSound = new Audio();
      youDiedSound.src = "https://veedva.github.io/weedkent_bot/dark-souls-you-died.mp3"; // ИСПРАВЛЕНО
      youDiedSound.preload = "auto";
      youDiedSound.volume = 0.8;
      
      soundInitialized = true;
      soundEnabled = true;
      console.log("Звук инициализирован");
    }
    
    function playDamageSound() {
      if (!soundEnabled || !damageAudio) return;
      
      // Меньше звуков - только 20% шанс
      if (Math.random() > 0.2) return;
      
      try {
        // Останавливаем предыдущий звук и начинаем новый
        damageAudio.pause();
        damageAudio.currentTime = 0;
        damageAudio.volume = 0.2 + (rage / 500);
        damageAudio.play().catch((e) => {
          console.log("Ошибка воспроизведения звука удара:", e);
        });
      } catch (error) {
        console.log("Ошибка при воспроизведении звука удара:", error);
      }
    }
    
    function playYouDiedSound() {
      if (!soundEnabled || !youDiedSound) return;
      
      try {
        console.log("Воспроизведение звука смерти...");
        
        // Даем небольшую задержку как в игре
        setTimeout(() => {
          youDiedSound.currentTime = 0;
          youDiedSound.volume = 0.8;
          youDiedSound.play()
            .then(() => {
              console.log("Звук смерти успешно воспроизведен");
            })
            .catch((e) => {
              console.log("Ошибка воспроизведения звука смерти:", e);
              // Пробуем альтернативный способ
              youDiedSound.load();
              youDiedSound.play().catch((e2) => {
                console.log("Вторая попытка тоже не удалась:", e2);
              });
            });
        }, 400);
      } catch (error) {
        console.log("Ошибка при воспроизведении звука смерти:", error);
      }
    }
    
    // =================== ОСНОВНЫЕ ФУНКЦИИ ===================
    function getProgressColor() {
      const percent = rage;
      if (percent < 20) return PROGRESS_COLORS[0];
      if (percent < 40) return PROGRESS_COLORS[1];
      if (percent < 50) return PROGRESS_COLORS[2];
      if (percent < 60) return PROGRESS_COLORS[3];
      if (percent < 80) return PROGRESS_COLORS[4];
      if (percent < 90) return PROGRESS_COLORS[5];
      if (percent < 95) return PROGRESS_COLORS[6];
      return PROGRESS_COLORS[7];
    }
    
    function updateUI() {
      const ragePercent = Math.min(rage, 100);
      progressBar.style.width = `${ragePercent}%`;
      progressBar.style.backgroundColor = getProgressColor();
    }
    
    function createTapHit(x, y) {
      const hit = document.createElement('div');
      hit.className = 'tap-hit';
      hit.style.left = `${x}px`;
      hit.style.top = `${y}px`;
      hit.style.background = `radial-gradient(circle, ${getProgressColor()} 0%, transparent 70%)`;
      
      document.body.appendChild(hit);
      setTimeout(() => {
        if (hit.parentNode) hit.remove();
      }, 350);
    }
    
    function createParticle(x, y, isEmoji) {
      const particle = document.createElement('div');
      particle.className = `rage-particle ${isEmoji ? 'rage-emoji' : 'rage-word'}`;
      particle.textContent = isEmoji 
        ? EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
        : WORDS[Math.floor(Math.random() * WORDS.length)];
      
      const intensity = Math.min(rage / 100, 1);
      
      const baseSize = isEmoji ? 36 : 28;
      const sizeMultiplier = 0.9 + (intensity * 0.5);
      const fontSize = Math.floor(baseSize * sizeMultiplier);
      particle.style.fontSize = `${fontSize}px`;
      
      // Сильный разлет
      const baseDistance = 70 + (intensity * 60);
      const angle = Math.random() * Math.PI * 2;
      const distance = baseDistance;
      
      particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
      particle.style.setProperty('--dy', `${Math.sin(angle) * distance * 0.7}px`);
      particle.style.setProperty('--rot', `${Math.random() * 40 - 20}deg`);
      particle.style.setProperty('--scale', sizeMultiplier);
      
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      particle.style.color = getProgressColor();
      
      particlesContainer.appendChild(particle);
      
      setTimeout(() => {
        if (particle.parentNode) particle.remove();
      }, 1200);
      
      // Ограничиваем количество частиц
      const particles = particlesContainer.querySelectorAll('.rage-particle');
      if (particles.length > 12) {
        particles[0].remove();
      }
    }
    
    function createFlash() {
      const flash = document.createElement('div');
      flash.className = 'screen-flash';
      
      const intensity = Math.min(rage / 100, 1);
      const opacity = 0.15 + (intensity * 0.2);
      const color = getProgressColor().replace(')', `, ${opacity})`).replace('#', 'rgba(');
      
      flash.style.background = color;
      
      document.body.appendChild(flash);
      setTimeout(() => {
        if (flash.parentNode) flash.remove();
      }, 250);
    }
    
    function createCriticalFlash() {
      const flash = document.createElement('div');
      flash.className = 'critical-flash';
      document.body.appendChild(flash);
      setTimeout(() => {
        if (flash.parentNode) flash.remove();
      }, 1500);
    }
    
    function showYouDied() {
      if (youDiedShown) return;
      youDiedShown = true;
      gameActive = false;
      
      console.log("Показываем YOU DIED");
      
      tapArea.style.pointerEvents = 'none';
      createCriticalFlash();
      
      // ЗВУК СМЕРТИ - ДОЛЖЕН ИГРАТЬСЯ
      playYouDiedSound();
      
      if (navigator.vibrate) {
        navigator.vibrate([400, 100, 400]);
      }
      
      setTimeout(() => {
        youDiedOverlay.style.display = 'flex';
        progressBar.parentElement.style.display = 'none';
        console.log("YOU DIED экран показан");
      }, 200);
    }
    
    // ФИКСИРУЕМ БАГ С УБЫВАНИЕМ ЯРОСТИ
    let decayInterval = null;
    
    function startDecay() {
      // Очищаем предыдущий интервал
      if (decayInterval) clearInterval(decayInterval);
      
      decayInterval = setInterval(() => {
        if (rage > 0 && gameActive) {
          // ПОСТОЯННАЯ СКОРОСТЬ УБЫВАНИЯ
          rage = Math.max(0, rage - 0.8);
          updateUI();
        }
      }, 100);
    }
    
    function stopDecay() {
      if (decayInterval) {
        clearInterval(decayInterval);
        decayInterval = null;
      }
    }
    
    function handleTap(x, y) {
      if (!gameActive || isProcessingTap) return;
      
      const now = Date.now();
      
      // ЗАЩИТА ОТ СЛИШКОМ ЧАСТЫХ КАСАНИЙ
      if (now - lastTapTime < 80) return;
      lastTapTime = now;
      
      isProcessingTap = true;
      setTimeout(() => { isProcessingTap = false; }, 80);
      
      if (!firstTapDone) {
        firstTapDone = true;
        initSoundOnFirstTap();
      }
      
      // Проверяем достижение 100%
      if (rage >= 100) {
        if (!youDiedShown) {
          console.log("Достигнуто 100% ярости");
          showYouDied();
        }
        return;
      }
      
      // Увеличиваем ярость
      rage = Math.min(rage + 3.5, 100);
      
      // Звук удара
      playDamageSound();
      
      // Визуальные эффекты
      createTapHit(x, y);
      createFlash();
      
      // Частицы
      const particleCount = rage > 70 ? 3 : (rage > 40 ? 2 : 1);
      
      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          const offsetX = (Math.random() * 40 - 20);
          const offsetY = (Math.random() * 40 - 20);
          createParticle(x + offsetX, y + offsetY, Math.random() > 0.5);
        }, i * 60);
      }
      
      // Вибрация
      if (navigator.vibrate && rage > 50 && Math.random() > 0.5) {
        const duration = Math.min(12, 5 + Math.floor(rage / 20));
        navigator.vibrate(duration);
      }
      
      updateUI();
      
      // Перезапускаем убывание после каждого тапа
      stopDecay();
      startDecay();
    }
    
    // =================== ОБРАБОТЧИКИ ===================
    tapArea.addEventListener('touchstart', function(e) {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });
    
    tapArea.addEventListener('click', function(e) {
      handleTap(e.clientX, e.clientY);
    });
    
    // =================== ИНИЦИАЛИЗАЦИЯ ===================
    updateUI();
    startDecay();
    
    // Автоматическая очистка старых частиц
    setInterval(() => {
      const particles = particlesContainer.querySelectorAll('.rage-particle');
      if (particles.length > 15) {
        const toRemove = particles.length - 12;
        for (let i = 0; i < toRemove; i++) {
          if (particles[i]) particles[i].remove();
        }
      }
    }, 2000);
    
    // Очистка при скрытии вкладки
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        const particles = particlesContainer.querySelectorAll('.rage-particle');
        particles.forEach(p => p.remove());
        stopDecay();
      } else if (gameActive) {
        startDecay();
      }
    });
    
    // ДЕБАГ: кнопка для тестирования звука смерти
    window.testDeathSound = function() {
      console.log("Тест звука смерти...");
      playYouDiedSound();
    };
    
    console.log("Игра загружена. Для теста звука смерти выполните testDeathSound() в консоли");
  </script>
</body>
</html>
