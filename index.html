<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤬 БЕСКОНЕЧНЫЙ ПИЗДЕЦ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      touch-action: manipulation !important;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }
    
    /* КНОПКА НА ВЕСЬ ЭКРАН */
    #rage-button {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      border: none;
      cursor: pointer;
      z-index: 1;
      outline: none;
    }
    
    /* СЛОВА И ЭМОДЗИ */
    .floating-element {
      position: absolute;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      font-weight: 900;
      text-shadow: 0 0 20px currentColor, 0 0 40px rgba(255, 255, 255, 0.5);
      animation: floatElement 3.5s ease-out forwards;
    }
    
    .word {
      font-size: 42px;
      font-family: 'Arial Black', Impact, sans-serif;
    }
    
    .emoji {
      font-size: 64px;
    }
    
    @keyframes floatElement {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8) rotate(0deg);
        filter: blur(0);
      }
      20% {
        opacity: 1;
        transform: translate(var(--tx), var(--ty)) scale(2) rotate(var(--rot));
      }
      40% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--tx) * 1.5), calc(var(--ty) * 1.5)) scale(0.5) rotate(calc(var(--rot) * 2));
        filter: blur(4px);
      }
    }
    
    /* ЭФФЕКТ ВСПЫШКИ */
    .flash {
      position: absolute;
      width: 100%;
      height: 100%;
      background: rgba(255, 71, 87, 0.3);
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      animation: flashEffect 0.4s ease-out;
    }
    
    @keyframes flashEffect {
      0% { opacity: 0.8; }
      100% { opacity: 0; }
    }
    
    /* ПУЛЬСАЦИЯ КНОПКИ */
    .pulse {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 71, 87, 0.2);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: pulseWave 1.2s ease-out;
    }
    
    @keyframes pulseWave {
      0% {
        opacity: 0.7;
        transform: scale(0.1);
      }
      100% {
        opacity: 0;
        transform: scale(3);
      }
    }
    
    /* ПРОГРЕСС БАР НАРАСТАНИЯ */
    .progress-container {
      position: absolute;
      bottom: 30px;
      left: 20px;
      right: 20px;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      z-index: 20;
      opacity: 0.7;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff4757, #ffcc00);
      width: 0%;
      transition: width 0.5s ease;
      border-radius: 3px;
    }
    
    /* ИНСТРУКЦИЯ */
    .instruction {
      position: absolute;
      top: 30px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 18px;
      color: #888;
      z-index: 20;
      padding: 0 20px;
      opacity: 0.8;
    }
    
    /* КНОПКА ВЫХОДА */
    .exit-btn {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 12px 30px;
      border-radius: 25px;
      font-size: 16px;
      z-index: 20;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }
    
    .exit-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }
    
    /* УРОВЕНЬ БЕШЕНСТВА */
    .rage-level {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      z-index: 20;
      color: #ffcc00;
      text-shadow: 0 0 10px #ffcc00;
    }
  </style>
</head>
<body>
  <div class="instruction">БЕЙ ПО ЭКРАНУ В ЛЮБОМ МЕСТЕ</div>
  <div class="rage-level" id="rageLevel">😐 СПОКОЙСТВИЕ</div>
  
  <button id="rage-button"></button>
  
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  
  <button class="exit-btn" onclick="Telegram.WebApp.close()">✖ ВЫЙТИ</button>

  <script>
    // Telegram
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    if (Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
    }
    
    // Данные
    let rageLevel = 0;
    let rageMultiplier = 1;
    let lastClickTime = 0;
    
    const RAGE_LEVELS = [
      { emoji: "😐", name: "СПОКОЙСТВИЕ", intensity: 1 },
      { emoji: "😠", name: "РАЗДРАЖЕНИЕ", intensity: 1.5 },
      { emoji: "😡", name: "ЗЛОСТЬ", intensity: 2 },
      { emoji: "🤬", name: "ЯРОСТЬ", intensity: 3 },
      { emoji: "💥", name: "БЕШЕНСТВО", intensity: 4 },
      { emoji: "🔥", name: "ИСТЕРИКА", intensity: 5 },
      { emoji: "☠️", name: "АПОКАЛИПСИС", intensity: 6 }
    ];
    
    const WORDS = ["ПИЗДЕЦ", "СУКА", "ЕБАТЬ", "НАХУЙ", "БЛЯТЬ", "ХУЙНЯ", "ЁБАНЫЙ", "ОХУЕТЬ", "ЗАЕБАЛО"];
    const EMOJIS = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡", "🌪", "☠️", "💣", "🧨"];
    
    // Функции
    function getCurrentLevel() {
      return RAGE_LEVELS[Math.min(rageLevel, RAGE_LEVELS.length - 1)];
    }
    
    function updateUI() {
      const level = getCurrentLevel();
      document.getElementById('rageLevel').textContent = `${level.emoji} ${level.name}`;
      document.getElementById('progressBar').style.width = `${Math.min(rageLevel * 10, 100)}%`;
    }
    
    function createElement(x, y, type, content) {
      const el = document.createElement('div');
      el.className = `floating-element ${type}`;
      el.textContent = content;
      
      // Случайное направление и цвет
      const angle = Math.random() * Math.PI * 2;
      const distance = 100 + Math.random() * 200 * rageMultiplier;
      el.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
      el.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
      el.style.setProperty('--rot', `${Math.random() * 60 - 30}deg`);
      
      if (type === 'word') {
        el.style.color = `hsl(${Math.random() * 360}, 100%, 70%)`;
      } else {
        el.style.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
      }
      
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }
    
    function createFlash(x, y) {
      const flash = document.createElement('div');
      flash.className = 'flash';
      flash.style.left = `${x}px`;
      flash.style.top = `${y}px`;
      
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 400);
    }
    
    function createPulse(x, y) {
      const pulse = document.createElement('div');
      pulse.className = 'pulse';
      pulse.style.left = `${x}px`;
      pulse.style.top = `${y}px`;
      pulse.style.width = pulse.style.height = `${50 * rageMultiplier}px`;
      
      document.body.appendChild(pulse);
      setTimeout(() => pulse.remove(), 1200);
    }
    
    function handleTap(x, y) {
      const now = Date.now();
      const timeDiff = now - lastClickTime;
      lastClickTime = now;
      
      // Увеличиваем уровень бешенства если клики частые
      if (timeDiff < 500) {
        rageLevel = Math.min(rageLevel + 1, RAGE_LEVELS.length - 1);
        rageMultiplier = getCurrentLevel().intensity;
      } else if (timeDiff > 2000) {
        // Сбрасываем если долго не кликали
        rageLevel = Math.max(0, rageLevel - 1);
        rageMultiplier = getCurrentLevel().intensity;
      }
      
      // Визуальные эффекты
      createFlash(x, y);
      createPulse(x, y);
      
      // Количество элементов зависит от уровня
      const elementCount = Math.floor(2 * rageMultiplier);
      
      for (let i = 0; i < elementCount; i++) {
        setTimeout(() => {
          // Слова
          if (Math.random() > 0.3) {
            const wordX = x + (Math.random() * 100 - 50);
            const wordY = y + (Math.random() * 100 - 50);
            createElement(wordX, wordY, 'word', WORDS[Math.floor(Math.random() * WORDS.length)]);
          }
          
          // Эмодзи
          if (Math.random() > 0.5) {
            const emojiX = x + (Math.random() * 120 - 60);
            const emojiY = y + (Math.random() * 120 - 60);
            createElement(emojiX, emojiY, 'emoji', EMOJIS[Math.floor(Math.random() * EMOJIS.length)]);
          }
        }, i * 50);
      }
      
      // Вибрация
      if (navigator.vibrate) {
        const pattern = rageLevel > 3 ? [50, 30, 50] : [30];
        navigator.vibrate(pattern);
      }
      
      updateUI();
    }
    
    // Обработчики
    document.getElementById('rage-button').addEventListener('click', function(e) {
      handleTap(e.clientX, e.clientY);
    });
    
    document.getElementById('rage-button').addEventListener('touchstart', function(e) {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });
    
    // Авто-сброс уровня
    setInterval(() => {
      if (Date.now() - lastClickTime > 3000 && rageLevel > 0) {
        rageLevel--;
        rageMultiplier = getCurrentLevel().intensity;
        updateUI();
      }
    }, 1000);
    
    // Инициализация
    updateUI();
  </script>
</body>
</html>
