<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤬 БЕСКОНЕЧНЫЙ КАТАРСИС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      touch-action: manipulation !important;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      width: 100vw;
      -webkit-font-smoothing: antialiased;
    }
    
    /* ЭКРАН ДЛЯ ТАПОВ */
    .tap-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 1;
      cursor: pointer;
    }
    
    /* УРОВЕНЬ ЯРОСТИ */
    .rage-level {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      z-index: 10;
      color: #ffcc00;
      text-shadow: 0 0 15px #ffcc00;
      pointer-events: none;
    }
    
    /* ПРОГРЕСС БАР */
    .progress-container {
      position: absolute;
      bottom: 90px;
      left: 30px;
      right: 30px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff4757, #ffcc00);
      width: 0%;
      transition: width 0.1s linear;
      border-radius: 4px;
    }
    
    /* КНОПКА ВЫХОДА */
    .exit-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 35px;
      border-radius: 25px;
      font-size: 17px;
      z-index: 10;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-appearance: none;
      border: none;
    }
    
    /* ВЫЛЕТАЮЩИЕ СЛОВА */
    .rage-particle {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      font-weight: 900;
      animation: particleFloat 1.5s ease-out forwards;
    }
    
    .rage-word {
      font-size: 34px;
      font-family: 'Arial Black', Impact, sans-serif;
      letter-spacing: 1px;
      text-shadow: 0 0 12px currentColor, 0 0 24px rgba(255, 255, 255, 0.2);
    }
    
    .rage-emoji {
      font-size: 44px;
      text-shadow: 0 0 15px currentColor, 0 0 30px rgba(255, 255, 255, 0.3);
    }
    
    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8) rotate(0deg);
      }
      40% {
        opacity: 1;
        transform: translate(var(--dx), var(--dy)) scale(1.6) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.3), calc(var(--dy) * 1.3)) scale(0.3) rotate(calc(var(--rot) * 1.5));
      }
    }
    
    /* ВСПЫШКА */
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 71, 87, 0.25);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: quickFlash 0.3s ease-out;
    }
    
    @keyframes quickFlash {
      0% { opacity: 0.7; }
      100% { opacity: 0; }
    }
    
    /* YOU DIED ЭКРАН - ТЕПЕРЬ ВМЕЩАЕТСЯ НА ЛЮБОМ ЭКРАНЕ */
    .you-died-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .you-died-text {
      font-family: 'Times New Roman', serif;
      font-size: 14vw; /* Адаптивный размер относительно ширины экрана */
      color: #8B0000;
      text-shadow: 
        0 0 10px #8B0000,
        0 0 20px #8B0000,
        0 0 30px #8B0000,
        2px 2px 0 #000;
      margin: 0;
      opacity: 0;
      animation: darkSoulsAppear 3s ease-out forwards;
      text-transform: uppercase;
      letter-spacing: 2vw; /* Адаптивный межбуквенный интервал */
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      padding: 0 5vw; /* Отступы относительно ширины экрана */
      max-width: 100%;
      overflow: hidden;
    }
    
    /* На очень маленьких экранах делаем еще меньше */
    @media (max-width: 400px) {
      .you-died-text {
        font-size: 56px;
        letter-spacing: 8px;
      }
    }
    
    /* На больших экранах ограничиваем максимальный размер */
    @media (min-width: 800px) {
      .you-died-text {
        font-size: 112px;
        letter-spacing: 16px;
      }
    }
    
    @keyframes darkSoulsAppear {
      0% { 
        opacity: 0;
        transform: scale(0.7) translateY(30px);
        filter: blur(20px) brightness(2);
      }
      30% {
        opacity: 0.8;
        transform: scale(1.05) translateY(0);
        filter: blur(5px) brightness(1.5);
      }
      50% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0) brightness(1);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0) brightness(1);
      }
    }
    
    /* КРИТИЧЕСКАЯ ВСПЫШКА */
    .critical-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #8B0000;
      opacity: 0;
      pointer-events: none;
      z-index: 900;
      animation: criticalFlash 1.5s ease-out;
    }
    
    @keyframes criticalFlash {
      0% { opacity: 0; }
      20% { opacity: 0.8; }
      40% { opacity: 0.5; }
      70% { opacity: 0.2; }
      100% { opacity: 0; }
    }
    
    /* ПУЛЬСАЦИЯ ПРИ ТАПЕ */
    .tap-pulse {
      position: absolute;
      border: 2px solid;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
      animation: pulseEffect 0.8s ease-out forwards;
    }
    
    @keyframes pulseEffect {
      0% {
        width: 30px;
        height: 30px;
        opacity: 0.7;
      }
      100% {
        width: 150px;
        height: 150px;
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="rage-level" id="rageLevel">😐 СПОКОЙНО</div>
  
  <div class="tap-area" id="tapArea"></div>
  
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  
  <button class="exit-btn" onclick="Telegram.WebApp.close()">✖ ЗАКРЫТЬ</button>
  
  <!-- YOU DIED ЭКРАН -->
  <div class="you-died-overlay" id="youDiedOverlay">
    <div class="you-died-text">YOU DIED</div>
  </div>

  <script>
    // =================== ТЕЛЕГРАМ ===================
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    if (Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
    }
    
    // =================== ДАННЫЕ ===================
    let rage = 0;
    let lastTapTime = 0;
    let soundEnabled = false;
    let soundInitialized = false;
    let soundCooldown = false;
    let audioElements = [];
    let youDiedSound = null;
    let currentAudioIndex = 0;
    let firstTapDone = false;
    let youDiedShown = false;
    let decayTimer = null;
    let gameActive = true;
    
    // Уровни ярости
    const LEVELS = [
      { emoji: "😐", name: "СПОКОЙНО", color: "#4dabf7", soundChance: 0.1 },
      { emoji: "😠", name: "НАПРЯЖЕНИЕ", color: "#ffa94d", soundChance: 0.15 },
      { emoji: "😡", name: "ЗЛОСТЬ", color: "#ff6b6b", soundChance: 0.2 },
      { emoji: "🤬", name: "ЯРОСТЬ", color: "#ff4757", soundChance: 0.25 },
      { emoji: "💥", name: "БЕШЕНСТВО", color: "#ffcc00", soundChance: 0.3 },
      { emoji: "🔥", name: "ИСТЕРИКА", color: "#ff3838", soundChance: 0.35 }
    ];
    
    // Слова и эмодзи
    const WORDS = [
      "ПИЗДА!", "СУКА!", "ЕБАТЬ!", "НАХУЙ!", "БЛЯТЬ!", "ХУЙНЯ!", 
      "ЁБАНЫЙ!", "ОХУЕТЬ!", "ЗАЕБАЛО!", "ПОШЛО НАХУЙ!", "ЁПТА!", 
      "БЛЯДЬ!", "ХУЁВО!", "ЕБЁНЫЙ!", "ПИЗДЕЦ!", "ВЪЕБАТЬ!", "ПРОЕБАТЬ!"
    ];
    const EMOJIS = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡", "🌪", "☠️", "💣", "🧨"];
    
    // =================== DOM ===================
    const tapArea = document.getElementById('tapArea');
    const rageLevelEl = document.getElementById('rageLevel');
    const progressBar = document.getElementById('progressBar');
    const youDiedOverlay = document.getElementById('youDiedOverlay');
    
    // =================== ЗВУК ===================
    function initSoundOnFirstTap() {
      if (soundInitialized) return;
      
      // Звуки ударов
      for (let i = 0; i < 2; i++) {
        const audio = new Audio();
        audio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
        audio.preload = "auto";
        audio.volume = 0.5;
        audioElements.push(audio);
      }
      
      // Звук YOU DIED
      youDiedSound = new Audio();
      youDiedSound.src = "https://veedva.github.io/weedkent_bot/dark-souls-you-died.mp3";
      youDiedSound.preload = "auto";
      youDiedSound.volume = 0.8;
      
      soundInitialized = true;
      soundEnabled = true;
    }
    
    function playDamageSound() {
      if (!soundEnabled || soundCooldown) return;
      
      const level = getCurrentLevel();
      if (Math.random() > level.soundChance) return;
      
      try {
        const audio = audioElements[currentAudioIndex];
        currentAudioIndex = (currentAudioIndex + 1) % audioElements.length;
        
        audio.currentTime = 0;
        audio.volume = 0.4 + (rage / 250);
        audio.play().catch(() => {});
        
        soundCooldown = true;
        setTimeout(() => { soundCooldown = false; }, 350);
      } catch (error) {}
    }
    
    function playYouDiedSound() {
      if (!soundEnabled || !youDiedSound) return;
      
      try {
        setTimeout(() => {
          youDiedSound.currentTime = 0;
          youDiedSound.volume = 0.8;
          youDiedSound.play().catch(() => {});
        }, 500);
      } catch (error) {}
    }
    
    // =================== ОСНОВНЫЕ ФУНКЦИИ ===================
    function getCurrentLevel() {
      const index = Math.floor(rage / 20);
      return LEVELS[Math.min(index, LEVELS.length - 1)];
    }
    
    function updateUI() {
      const level = getCurrentLevel();
      rageLevelEl.textContent = `${level.emoji} ${level.name}`;
      rageLevelEl.style.color = level.color;
      rageLevelEl.style.textShadow = `0 0 20px ${level.color}`;
      progressBar.style.width = `${rage}%`;
      progressBar.style.background = `linear-gradient(90deg, ${level.color}, #ffcc00)`;
    }
    
    function createParticle(x, y, isEmoji) {
      const particle = document.createElement('div');
      particle.className = `rage-particle ${isEmoji ? 'rage-emoji' : 'rage-word'}`;
      particle.textContent = isEmoji 
        ? EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
        : WORDS[Math.floor(Math.random() * WORDS.length)];
      
      // Угол и дистанция
      const angle = Math.random() * Math.PI * 2;
      const distance = 70 + Math.random() * 100 * (rage / 100);
      particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
      particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
      particle.style.setProperty('--rot', `${Math.random() * 40 - 20}deg`);
      
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      
      // Цвет в зависимости от уровня ярости
      const level = getCurrentLevel();
      particle.style.color = level.color;
      
      document.body.appendChild(particle);
      
      // Автоудаление через время
      setTimeout(() => {
        if (particle.parentNode) {
          particle.remove();
        }
      }, 1500);
    }
    
    function createFlash() {
      const flash = document.createElement('div');
      flash.className = 'screen-flash';
      
      const level = getCurrentLevel();
      flash.style.background = `rgba(${parseInt(level.color.slice(1,3), 16)}, ${parseInt(level.color.slice(3,5), 16)}, ${parseInt(level.color.slice(5,7), 16)}, 0.25)`;
      
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 300);
    }
    
    function createPulse(x, y) {
      const pulse = document.createElement('div');
      pulse.className = 'tap-pulse';
      pulse.style.left = `${x}px`;
      pulse.style.top = `${y}px`;
      
      const level = getCurrentLevel();
      pulse.style.borderColor = level.color;
      
      document.body.appendChild(pulse);
      setTimeout(() => pulse.remove(), 800);
    }
    
    function createCriticalFlash() {
      const flash = document.createElement('div');
      flash.className = 'critical-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 1500);
    }
    
    function showYouDied() {
      if (youDiedShown) return;
      youDiedShown = true;
      gameActive = false;
      
      // Отключаем тапы
      tapArea.style.pointerEvents = 'none';
      
      // Красная вспышка
      createCriticalFlash();
      
      // Звук YOU DIED
      playYouDiedSound();
      
      // Сильная вибрация
      if (navigator.vibrate) {
        navigator.vibrate([400, 200, 400]);
      }
      
      // Показываем YOU DIED
      setTimeout(() => {
        youDiedOverlay.style.display = 'flex';
        
        // Прячем интерфейс игры
        rageLevelEl.style.display = 'none';
        progressBar.parentElement.style.display = 'none';
      }, 600);
    }
    
    // СБРОС ЯРОСТИ - ДЕЛАЕМ БЫСТРЕЕ СПАД
    function startDecay() {
      if (decayTimer) clearTimeout(decayTimer);
      
      decayTimer = setTimeout(() => {
        if (rage > 0) {
          // УВЕЛИЧИВАЕМ СКОРОСТЬ СПАДА
          const decayRate = 3 + (rage / 20);
          rage = Math.max(rage - decayRate, 0);
          
          if (gameActive) {
            updateUI();
          }
          
          if (rage > 0) {
            startDecay();
          }
        }
      }, 100);
    }
    
    function handleTap(x, y) {
      if (!gameActive) return;
      
      if (!firstTapDone) {
        firstTapDone = true;
        initSoundOnFirstTap();
      }
      
      if (rage >= 100 && !youDiedShown) {
        showYouDied();
        return;
      }
      
      const now = Date.now();
      const timeDiff = now - lastTapTime;
      lastTapTime = now;
      
      // СИЛЬНО УМЕНЬШАЕМ РОСТ ЯРОСТИ!
      let rageGain = 0;
      
      if (timeDiff < 100) {        // ОЧЕНЬ БЫСТРО (<100ms)
        rageGain = 6;
      } else if (timeDiff < 200) { // БЫСТРО (100-200ms)
        rageGain = 5;
      } else if (timeDiff < 350) { // СРЕДНЕ (200-350ms)
        rageGain = 4;
      } else if (timeDiff < 500) { // МЕДЛЕННО (350-500ms)
        rageGain = 3;
      } else {                     // ОЧЕНЬ МЕДЛЕННО (>500ms)
        rageGain = 2;
      }
      
      // ШТРАФ ЗА ВЫСОКИЙ УРОВЕНЬ - сложнее расти дальше
      const levelPenalty = Math.max(0, Math.floor(rage / 30));
      rageGain = Math.max(rageGain - levelPenalty, 1);
      
      rage = Math.min(rage + rageGain, 100);
      
      // ЗВУК (чаще на высоких уровнях)
      playDamageSound();
      
      // ВСПЫШКА (чаще на высоких уровнях)
      if (Math.random() > 0.5 || rage > 50) {
        createFlash();
      }
      
      // ПУЛЬСАЦИЯ
      createPulse(x, y);
      
      // ВЫЛЕТАЮЩИЕ ЭЛЕМЕНТЫ
      // На высоких уровнях больше частиц
      const baseParticles = rage > 70 ? 3 : (rage > 40 ? 2 : 1);
      const speedMultiplier = timeDiff < 200 ? 2 : (timeDiff < 400 ? 1.5 : 1);
      const particleCount = Math.floor(baseParticles * speedMultiplier);
      
      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          const offsetX = (Math.random() * 80 - 40);
          const offsetY = (Math.random() * 80 - 40);
          
          if (Math.random() > 0.5) {
            createParticle(x + offsetX, y + offsetY, false); // Слово
          } else {
            createParticle(x + offsetX, y + offsetY, true); // Эмодзи
          }
        }, i * 40);
      }
      
      // ВИБРАЦИЯ
      if (navigator.vibrate) {
        const intensity = rage / 100;
        const duration = Math.floor(10 + intensity * 30);
        
        if (timeDiff < 250 || rage > 60) {
          navigator.vibrate(duration);
        }
      }
      
      updateUI();
      
      // ЗАПУСКАЕМ СБРОС
      startDecay();
    }
    
    // =================== ОБРАБОТЧИКИ ===================
    tapArea.addEventListener('click', function(e) {
      handleTap(e.clientX, e.clientY);
    });
    
    tapArea.addEventListener('touchstart', function(e) {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });
    
    // =================== ИНИЦИАЛИЗАЦИЯ ===================
    updateUI();
    
    // Авто-запуск спада
    startDecay();
  </script>
</body>
</html>
