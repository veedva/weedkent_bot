<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤬 БЕСКОНЕЧНЫЙ КАТАРСИС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ЖЁСТКИЙ СБРОС */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      touch-action: manipulation !important;
      outline: none !important;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      width: 100vw;
    }
    
    /* ЭКРАН ДЛЯ ТАПОВ - НЕ BUTTON! */
    .tap-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 1;
      /* Убираем ВСЕ стили кнопки */
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      display: block !important;
    }
    
    /* ТЕКСТ ИНСТРУКЦИИ */
    .instruction {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 18px;
      color: #888;
      z-index: 10;
      padding: 0 20px;
      pointer-events: none;
    }
    
    /* УРОВЕНЬ ЯРОСТИ */
    .rage-level {
      position: absolute;
      top: 80px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      z-index: 10;
      color: #ffcc00;
      text-shadow: 0 0 15px #ffcc00;
      pointer-events: none;
    }
    
    /* ПРОГРЕСС БАР */
    .progress-container {
      position: absolute;
      bottom: 100px;
      left: 30px;
      right: 30px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff4757, #ffcc00);
      width: 0%;
      transition: width 0.3s ease;
      border-radius: 4px;
    }
    
    /* КНОПКА ВЫХОДА */
    .exit-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 35px;
      border-radius: 25px;
      font-size: 17px;
      z-index: 10;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-appearance: none;
      border: none;
    }
    
    /* ВЫЛЕТАЮЩИЕ ЭЛЕМЕНТЫ - ОПТИМИЗИРОВАННЫЕ */
    .rage-particle {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      font-weight: 900;
      animation: particleFloat 2.5s ease-out forwards;
      text-shadow: 0 0 10px currentColor;
    }
    
    .rage-word {
      font-size: 36px;
      font-family: 'Arial Black', Impact, sans-serif;
    }
    
    .rage-emoji {
      font-size: 52px;
    }
    
    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.9) rotate(0deg);
      }
      30% {
        opacity: 1;
        transform: translate(var(--dx), var(--dy)) scale(1.8) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.3), calc(var(--dy) * 1.3)) scale(0.4) rotate(calc(var(--rot) * 1.5));
      }
    }
    
    /* ВСПЫШКА - ОДНА НА ЭКРАН */
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 71, 87, 0.2);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: quickFlash 0.3s ease-out;
    }
    
    @keyframes quickFlash {
      0% { opacity: 0.6; }
      100% { opacity: 0; }
    }
    
    /* ПУЛЬСАЦИЯ ВОКРУГ ТАПА */
    .tap-ripple {
      position: absolute;
      border-radius: 50%;
      border: 3px solid rgba(255, 71, 87, 0.6);
      opacity: 0;
      pointer-events: none;
      z-index: 3;
      animation: rippleEffect 0.8s ease-out;
    }
    
    @keyframes rippleEffect {
      0% {
        opacity: 0.8;
        transform: scale(0.3);
        border-width: 8px;
      }
      100% {
        opacity: 0;
        transform: scale(2);
        border-width: 1px;
      }
    }
  </style>
</head>
<body>
  <div class="instruction">ТАПАЙ ВЕЗДЕ → ВЫПУСТИ ПАР</div>
  <div class="rage-level" id="rageLevel">😐 СПОКОЙНО</div>
  
  <div class="tap-area" id="tapArea"></div>
  
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  
  <button class="exit-btn" onclick="Telegram.WebApp.close()">✖ ВЫЙТИ</button>

  <script>
    // Telegram WebApp
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    if (Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
    }
    
    // Простые данные
    let rage = 0; // 0-100
    let lastTapTime = 0;
    let activeParticles = 0;
    const MAX_PARTICLES = 15; // Лимит чтобы не лагало
    
    // Уровни ярости
    const LEVELS = [
      { emoji: "😐", name: "СПОКОЙНО", color: "#4dabf7" },
      { emoji: "😠", name: "НАПРЯЖЕНИЕ", color: "#ffa94d" },
      { emoji: "😡", name: "ЗЛОСТЬ", color: "#ff6b6b" },
      { emoji: "🤬", name: "ЯРОСТЬ", color: "#ff4757" },
      { emoji: "💥", name: "БЕШЕНСТВО", color: "#ffcc00" },
      { emoji: "🔥", name: "ИСТЕРИКА", color: "#ff3838" }
    ];
    
    // Слова и эмодзи
    const WORDS = ["ПИЗДА", "СУКА", "ЕБАТЬ", "НАХУЙ", "БЛЯТЬ", "ХУЙНЯ"];
    const EMOJIS = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡"];
    
    // Элементы DOM
    const tapArea = document.getElementById('tapArea');
    const rageLevelEl = document.getElementById('rageLevel');
    const progressBar = document.getElementById('progressBar');
    
    // Функции
    function getCurrentLevel() {
      const index = Math.floor(rage / 20);
      return LEVELS[Math.min(index, LEVELS.length - 1)];
    }
    
    function updateUI() {
      const level = getCurrentLevel();
      rageLevelEl.textContent = `${level.emoji} ${level.name}`;
      rageLevelEl.style.color = level.color;
      rageLevelEl.style.textShadow = `0 0 15px ${level.color}`;
      progressBar.style.width = `${rage}%`;
      progressBar.style.background = level.color;
    }
    
    function createParticle(x, y, isEmoji) {
      if (activeParticles >= MAX_PARTICLES) return;
      
      activeParticles++;
      
      const particle = document.createElement('div');
      particle.className = `rage-particle ${isEmoji ? 'rage-emoji' : 'rage-word'}`;
      particle.textContent = isEmoji 
        ? EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
        : WORDS[Math.floor(Math.random() * WORDS.length)];
      
      // Случайное направление
      const angle = Math.random() * Math.PI * 2;
      const distance = 80 + Math.random() * 120 * (rage / 100);
      particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
      particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
      particle.style.setProperty('--rot', `${Math.random() * 40 - 20}deg`);
      
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      
      // Цвет из текущего уровня
      const level = getCurrentLevel();
      particle.style.color = level.color;
      
      document.body.appendChild(particle);
      
      // Удаляем через время
      setTimeout(() => {
        particle.remove();
        activeParticles--;
      }, 2500);
    }
    
    function createFlash() {
      const flash = document.createElement('div');
      flash.className = 'screen-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 300);
    }
    
    function createRipple(x, y) {
      const ripple = document.createElement('div');
      ripple.className = 'tap-ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      ripple.style.width = ripple.style.height = `${50 + rage}px`;
      
      const level = getCurrentLevel();
      ripple.style.borderColor = level.color;
      
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 800);
    }
    
    function handleTap(x, y) {
      const now = Date.now();
      const timeDiff = now - lastTapTime;
      lastTapTime = now;
      
      // Увеличиваем ярость
      if (timeDiff < 300) {
        rage = Math.min(rage + 8, 100); // Быстрые тапы
      } else if (timeDiff < 1000) {
        rage = Math.min(rage + 5, 100); // Средние тапы
      } else {
        rage = Math.min(rage + 3, 100); // Медленные тапы
      }
      
      // Эффекты
      createFlash();
      createRipple(x, y);
      
      // Количество частиц зависит от ярости
      const particleCount = Math.floor(1 + (rage / 25));
      
      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          // Случайный сдвиг от точки тапа
          const offsetX = (Math.random() * 100 - 50);
          const offsetY = (Math.random() * 100 - 50);
          
          // Слова или эмодзи
          if (Math.random() > 0.4) {
            createParticle(x + offsetX, y + offsetY, false);
          }
          if (Math.random() > 0.5) {
            createParticle(x + offsetX, y + offsetY, true);
          }
        }, i * 50);
      }
      
      // Вибрация
      if (navigator.vibrate) {
        const duration = Math.min(30 + rage / 2, 70);
        navigator.vibrate(duration);
      }
      
      updateUI();
    }
    
    // Сброс ярости со временем
    function decayRage() {
      if (Date.now() - lastTapTime > 1500 && rage > 0) {
        rage = Math.max(rage - 2, 0);
        updateUI();
      }
    }
    
    // Обработчики событий
    tapArea.addEventListener('click', function(e) {
      handleTap(e.clientX, e.clientY);
    });
    
    tapArea.addEventListener('touchstart', function(e) {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });
    
    // Таймеры
    setInterval(decayRage, 500);
    
    // Инициализация
    updateUI();
    
    // Авто-демо (можно удалить)
    // let demo = false;
    // if (demo) {
    //   setInterval(() => {
    //     if (Math.random() > 0.5) {
    //       const x = 50 + Math.random() * (window.innerWidth - 100);
    //       const y = 150 + Math.random() * (window.innerHeight - 300);
    //       handleTap(x, y);
    //     }
    //   }, 200);
    // }
  </script>
</body>
</html>
