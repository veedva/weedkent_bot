<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤬 БЕСКОНЕЧНЫЙ КАТАРСИС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      touch-action: manipulation !important;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      width: 100vw;
      -webkit-font-smoothing: antialiased;
    }
    
    /* ЭКРАН ДЛЯ ТАПОВ */
    .tap-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 1;
      cursor: pointer;
    }
    
    /* УРОВЕНЬ ЯРОСТИ */
    .rage-level {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      z-index: 10;
      color: #ffcc00;
      text-shadow: 0 0 15px #ffcc00;
      pointer-events: none;
    }
    
    /* ПРОГРЕСС БАР */
    .progress-container {
      position: absolute;
      bottom: 90px;
      left: 30px;
      right: 30px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff4757, #ffcc00);
      width: 0%;
      transition: width 0.1s linear;
      border-radius: 4px;
    }
    
    /* КНОПКА ВЫХОДА */
    .exit-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 35px;
      border-radius: 25px;
      font-size: 17px;
      z-index: 10;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-appearance: none;
      border: none;
    }
    
    /* ВЫЛЕТАЮЩИЕ СЛОВА - БАЗОВЫЕ СТИЛИ */
    .rage-particle {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      font-weight: 900;
      animation: particleFloat 1.2s ease-out forwards;
    }
    
    .rage-word {
      font-size: 34px;
      font-family: 'Arial Black', Impact, sans-serif;
      letter-spacing: 1px;
      text-shadow: 0 0 10px currentColor;
    }
    
    .rage-emoji {
      font-size: 44px;
      text-shadow: 0 0 15px currentColor;
    }
    
    /* ПРОСТАЯ АНИМАЦИЯ */
    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8);
      }
      40% {
        opacity: 1;
        transform: translate(var(--dx), var(--dy)) scale(1.4);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.2), calc(var(--dy) * 1.2)) scale(0.2);
      }
    }
    
    /* ВСПЫШКА */
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 71, 87, 0.25);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: quickFlash 0.2s ease-out;
    }
    
    @keyframes quickFlash {
      0% { opacity: 0.6; }
      100% { opacity: 0; }
    }
    
    /* YOU DIED ЭКРАН - ПРАВИЛЬНАЯ ВЕРСТКА */
    .you-died-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .you-died-text {
      font-family: 'Times New Roman', serif;
      font-size: min(18vw, 96px); /* Ограничиваем максимальный размер */
      color: #8B0000;
      text-shadow: 
        0 0 20px #8B0000,
        0 0 40px #8B0000,
        2px 2px 0 #000,
        4px 4px 0 rgba(0, 0, 0, 0.8);
      margin: 0;
      opacity: 0;
      animation: darkSoulsAppear 2.5s ease-out forwards;
      text-transform: uppercase;
      letter-spacing: min(3vw, 15px);
      line-height: 1;
      text-align: center;
      white-space: nowrap; /* ВАЖНО: не переносить текст */
      padding: 0 20px;
    }
    
    @keyframes darkSoulsAppear {
      0% { 
        opacity: 0;
        transform: scale(0.7) translateY(30px);
        filter: blur(15px);
      }
      30% {
        opacity: 0.8;
        transform: scale(1.05) translateY(0);
        filter: blur(5px);
      }
      50% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    
    /* КРИТИЧЕСКАЯ ВСПЫШКА */
    .critical-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #8B0000;
      opacity: 0;
      pointer-events: none;
      z-index: 900;
      animation: criticalFlash 1.2s ease-out;
    }
    
    @keyframes criticalFlash {
      0% { opacity: 0; }
      20% { opacity: 0.6; }
      60% { opacity: 0.2; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="rage-level" id="rageLevel">😐 СПОКОЙНО</div>
  
  <div class="tap-area" id="tapArea"></div>
  
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  
  <button class="exit-btn" onclick="Telegram.WebApp.close()">✖ ЗАКРЫТЬ</button>
  
  <!-- YOU DIED ЭКРАН -->
  <div class="you-died-overlay" id="youDiedOverlay">
    <div class="you-died-text">YOU DIED</div>
  </div>

  <script>
    // =================== ТЕЛЕГРАМ ===================
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    if (Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
    }
    
    // =================== ДАННЫЕ ===================
    let rage = 0;
    let lastTapTime = 0;
    let soundEnabled = false;
    let soundInitialized = false;
    let soundCooldown = false;
    let audioElements = [];
    let youDiedSound = null;
    let currentAudioIndex = 0;
    let firstTapDone = false;
    let youDiedShown = false;
    let decayTimer = null;
    let gameActive = true;
    
    // Уровни ярости
    const LEVELS = [
      { emoji: "😐", name: "СПОКОЙНО", color: "#4dabf7", soundChance: 0.1 },
      { emoji: "😠", name: "НАПРЯЖЕНИЕ", color: "#ffa94d", soundChance: 0.15 },
      { emoji: "😡", name: "ЗЛОСТЬ", color: "#ff6b6b", soundChance: 0.2 },
      { emoji: "🤬", name: "ЯРОСТЬ", color: "#ff4757", soundChance: 0.25 },
      { emoji: "💥", name: "БЕШЕНСТВО", color: "#ffcc00", soundChance: 0.3 },
      { emoji: "🔥", name: "ИСТЕРИКА", color: "#ff3838", soundChance: 0.35 }
    ];
    
    // Слова и эмодзи
    const WORDS = [
      "ПИЗДА!", "СУКА!", "ЕБАТЬ!", "НАХУЙ!", "БЛЯТЬ!", "ХУЙНЯ!", 
      "ЁБАНЫЙ!", "ОХУЕТЬ!", "ЗАЕБАЛО!", "ПОШЛО НАХУЙ!", "ЁПТА!", 
      "БЛЯДЬ!", "ХУЁВО!", "ЕБЁНЫЙ!", "ПИЗДЕЦ!", "ВЪЕБАТЬ!", "ПРОЕБАТЬ!"
    ];
    const EMOJIS = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡", "🌪", "☠️", "💣", "🧨"];
    
    // =================== DOM ===================
    const tapArea = document.getElementById('tapArea');
    const rageLevelEl = document.getElementById('rageLevel');
    const progressBar = document.getElementById('progressBar');
    const youDiedOverlay = document.getElementById('youDiedOverlay');
    
    // =================== ЗВУК ===================
    function initSoundOnFirstTap() {
      if (soundInitialized) return;
      
      // Звуки ударов
      for (let i = 0; i < 2; i++) {
        const audio = new Audio();
        audio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
        audio.preload = "auto";
        audio.volume = 0.5;
        audioElements.push(audio);
      }
      
      // Звук YOU DIED
      youDiedSound = new Audio();
      youDiedSound.src = "https://veedva.github.io/weedkent_bot/dark-souls-you-died.mp3";
      youDiedSound.preload = "auto";
      youDiedSound.volume = 0.8;
      
      soundInitialized = true;
      soundEnabled = true;
    }
    
    function playDamageSound() {
      if (!soundEnabled || soundCooldown) return;
      
      const level = getCurrentLevel();
      if (Math.random() > level.soundChance) return;
      
      try {
        const audio = audioElements[currentAudioIndex];
        currentAudioIndex = (currentAudioIndex + 1) % audioElements.length;
        
        audio.currentTime = 0;
        audio.volume = 0.4 + (rage / 250);
        audio.play().catch(() => {});
        
        soundCooldown = true;
        setTimeout(() => { soundCooldown = false; }, 350);
      } catch (error) {}
    }
    
    function playYouDiedSound() {
      if (!soundEnabled || !youDiedSound) return;
      
      try {
        setTimeout(() => {
          youDiedSound.currentTime = 0;
          youDiedSound.volume = 0.8;
          youDiedSound.play().catch(() => {});
        }, 500);
      } catch (error) {}
    }
    
    // =================== ОСНОВНЫЕ ФУНКЦИИ ===================
    function getCurrentLevel() {
      const index = Math.floor(rage / 20);
      return LEVELS[Math.min(index, LEVELS.length - 1)];
    }
    
    function updateUI() {
      const level = getCurrentLevel();
      rageLevelEl.textContent = `${level.emoji} ${level.name}`;
      rageLevelEl.style.color = level.color;
      rageLevelEl.style.textShadow = `0 0 20px ${level.color}`;
      progressBar.style.width = `${rage}%`;
      progressBar.style.background = `linear-gradient(90deg, ${level.color}, #ffcc00)`;
    }
    
    // ПРОСТАЯ ФУНКЦИЯ СОЗДАНИЯ ЧАСТИЦ - БЕЗ СЛОЖНОЙ ОПТИМИЗАЦИИ
    function createParticle(x, y, isEmoji) {
      const particle = document.createElement('div');
      particle.className = `rage-particle ${isEmoji ? 'rage-emoji' : 'rage-word'}`;
      particle.textContent = isEmoji 
        ? EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
        : WORDS[Math.floor(Math.random() * WORDS.length)];
      
      // Угол и дистанция
      const angle = Math.random() * Math.PI * 2;
      const distance = 50 + Math.random() * 80 * (rage / 100);
      particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
      particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
      
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      
      // Цвет в зависимости от уровня ярости
      const level = getCurrentLevel();
      particle.style.color = level.color;
      
      document.body.appendChild(particle);
      
      // Автоудаление через время
      setTimeout(() => {
        if (particle.parentNode) {
          particle.remove();
        }
      }, 1200);
    }
    
    function createFlash() {
      const flash = document.createElement('div');
      flash.className = 'screen-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 200);
    }
    
    function createCriticalFlash() {
      const flash = document.createElement('div');
      flash.className = 'critical-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 1200);
    }
    
    function showYouDied() {
      if (youDiedShown) return;
      youDiedShown = true;
      gameActive = false;
      
      // Отключаем тапы
      tapArea.style.pointerEvents = 'none';
      
      // Красная вспышка
      createCriticalFlash();
      
      // Звук YOU DIED
      playYouDiedSound();
      
      // Вибрация
      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
      }
      
      // Показываем YOU DIED
      setTimeout(() => {
        youDiedOverlay.style.display = 'flex';
        
        // Прячем интерфейс игры
        rageLevelEl.style.display = 'none';
        progressBar.parentElement.style.display = 'none';
      }, 600);
    }
    
    // СБРОС ЯРОСТИ
    function startDecay() {
      if (decayTimer) clearTimeout(decayTimer);
      
      decayTimer = setTimeout(() => {
        if (rage > 0) {
          const decayRate = 2 + (rage / 25);
          rage = Math.max(rage - decayRate, 0);
          
          if (gameActive) {
            updateUI();
          }
          
          if (rage > 0) {
            startDecay();
          }
        }
      }, 100);
    }
    
    function handleTap(x, y) {
      if (!gameActive) return;
      
      if (!firstTapDone) {
        firstTapDone = true;
        initSoundOnFirstTap();
      }
      
      if (rage >= 100 && !youDiedShown) {
        showYouDied();
        return;
      }
      
      const now = Date.now();
      const timeDiff = now - lastTapTime;
      lastTapTime = now;
      
      // ЛЕГКИЙ РОСТ
      let rageGain = 0;
      
      if (timeDiff < 150) {
        rageGain = 10;
      } else if (timeDiff < 300) {
        rageGain = 8;
      } else if (timeDiff < 500) {
        rageGain = 6;
      } else {
        rageGain = 4;
      }
      
      // БОНУС за уровень
      const levelBonus = Math.floor(rage / 20) * 2;
      rageGain += levelBonus;
      
      rageGain = Math.max(rageGain, 4);
      rage = Math.min(rage + rageGain, 100);
      
      // ЗВУК
      playDamageSound();
      
      // ВСПЫШКА (чаще на быстрых тапах)
      if (timeDiff < 300 || Math.random() > 0.4) {
        createFlash();
      }
      
      // ВЫЛЕТАЮЩИЕ ЭЛЕМЕНТЫ - ПРОСТО И РАБОТАЕТ
      // Создаем 1-3 частицы в зависимости от скорости
      const particleCount = timeDiff < 200 ? 3 : (timeDiff < 400 ? 2 : 1);
      
      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          const offsetX = (Math.random() * 60 - 30);
          const offsetY = (Math.random() * 60 - 30);
          
          // Чередуем слова и эмодзи
          if (i % 2 === 0) {
            createParticle(x + offsetX, y + offsetY, false); // Слово
          } else {
            createParticle(x + offsetX, y + offsetY, true); // Эмодзи
          }
        }, i * 30); // Небольшая задержка между частицами
      }
      
      // ВИБРАЦИЯ (только на быстрых тапах и высоком уровне)
      if (navigator.vibrate && rage > 40 && timeDiff < 250) {
        const duration = Math.min(15 + rage / 5, 40);
        navigator.vibrate(duration);
      }
      
      updateUI();
      
      // ЗАПУСКАЕМ СБРОС
      startDecay();
    }
    
    // =================== ОБРАБОТЧИКИ ===================
    tapArea.addEventListener('click', function(e) {
      handleTap(e.clientX, e.clientY);
    });
    
    tapArea.addEventListener('touchstart', function(e) {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });
    
    // =================== ИНИЦИАЛИЗАЦИЯ ===================
    updateUI();
    
    // Авто-запуск спада
    startDecay();
  </script>
</body>
</html>
