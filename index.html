<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ПИЗДЕЦ-ГЕНЕРАТОР | WeedKent</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Arial Black', 'Impact', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    h1 { font-size: 32px; color: #ff3838; margin-bottom: 10px; text-shadow: 0 0 20px #ff3838; }
    .subtitle { color: #888; margin-bottom: 30px; }
    #counter { font-size: 72px; color: #ff3838; margin: 20px 0; font-weight: bold; }
    #pizdec-button {
      width: 250px; height: 250px; background: #ff3838; border: none; border-radius: 50%;
      color: white; font-size: 36px; font-weight: bold; cursor: pointer; margin: 30px 0;
      transition: transform 0.1s; box-shadow: 0 0 50px #ff3838;
    }
    #pizdec-button:active { transform: scale(0.9); }
    .particle {
      position: absolute; pointer-events: none; font-size: 24px; font-weight: bold;
      animation: explode 1.5s forwards; text-shadow: 0 0 10px currentColor;
    }
    @keyframes explode {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--x),var(--y)) scale(0); }
    }
    .close-btn {
      background: #333; color: white; border: none; padding: 12px 30px;
      border-radius: 25px; margin-top: 30px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>🤬 ПИЗДЕЦ-ГЕНЕРАТОР</h1>
  <div class="subtitle">ЖМИ КНОПКУ И ВЫПУСКАЙ ПАР</div>
  <div id="counter">0</div>
  <button id="pizdec-button">ПИЗДЕЦ</button>
  <button class="close-btn" onclick="Telegram.WebApp.close()">✖ ЗАКРЫТЬ</button>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    let clicks = 0;
    const words = ["ПИЗДА", "СУКА", "ЕБАТЬ", "НАХУЙ", "БЛЯТЬ", "ХУЙНЯ", "ЁБАНЫЙ"];
    const emojis = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥"];
    
    document.getElementById('pizdec-button').addEventListener('click', function(e) {
      clicks++;
      document.getElementById('counter').textContent = clicks;
      
      // Создаём частицы
      for(let i = 0; i < 10; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.textContent = Math.random() > 0.5 
          ? words[Math.floor(Math.random() * words.length)]
          : emojis[Math.floor(Math.random() * emojis.length)];
        
        particle.style.color = `hsl(${Math.random()*360}, 100%, 60%)`;
        particle.style.left = e.clientX + 'px';
        particle.style.top = e.clientY + 'px';
        
        const angle = Math.random() * Math.PI * 2;
        const dist = 100 + Math.random() * 150;
        particle.style.setProperty('--x', Math.cos(angle)*dist + 'px');
        particle.style.setProperty('--y', Math.sin(angle)*dist + 'px');
        
        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 1500);
      }
      
      // Вибрация
      if(navigator.vibrate) navigator.vibrate(50);
    });
    
    if(Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
    }
  </script>
</body>
</html>
