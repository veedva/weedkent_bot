<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤬 БЕСКОНЕЧНЫЙ КАТАРСИС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      touch-action: manipulation !important;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      width: 100vw;
      -webkit-font-smoothing: antialiased;
    }
    
    /* ЭКРАН ДЛЯ ТАПОВ */
    .tap-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 1;
      cursor: pointer;
    }
    
    /* УРОВЕНЬ ЯРОСТИ */
    .rage-level {
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      z-index: 10;
      color: #ffcc00;
      text-shadow: 0 0 15px #ffcc00;
      pointer-events: none;
    }
    
    /* ПРОГРЕСС БАР */
    .progress-container {
      position: absolute;
      bottom: 90px;
      left: 30px;
      right: 30px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff4757, #ffcc00);
      width: 0%;
      transition: width 0.1s linear;
      border-radius: 4px;
    }
    
    /* КНОПКА ВЫХОДА */
    .exit-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 35px;
      border-radius: 25px;
      font-size: 17px;
      z-index: 1002;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-appearance: none;
      border: none;
    }
    
    /* КОНТЕЙНЕР ДЛЯ ЧАСТИЦ (ВАЖНО!) */
    .particles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
      contain: strict; /* Оптимизация для браузера */
    }
    
    /* ВЫЛЕТАЮЩИЕ СЛОВА */
    .rage-particle {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      font-weight: 900;
      animation: particleFloat 1.2s ease-out forwards;
      will-change: transform, opacity; /* Оптимизация анимации */
    }
    
    .rage-word {
      font-family: 'Arial Black', Impact, sans-serif;
      letter-spacing: 1px;
      text-shadow: 0 0 10px currentColor, 0 0 20px rgba(255, 255, 255, 0.2);
    }
    
    .rage-emoji {
      text-shadow: 0 0 12px currentColor, 0 0 25px rgba(255, 255, 255, 0.3);
    }
    
    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(var(--scale)) rotate(0deg);
      }
      40% {
        opacity: 1;
        transform: translate(var(--dx), var(--dy)) scale(calc(var(--scale) * 1.3)) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.3), calc(var(--dy) * 1.3)) scale(calc(var(--scale) * 0.3));
      }
    }
    
    /* ВСПЫШКА ЭКРАНА */
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 71, 87, 0.25);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: quickFlash 0.25s ease-out;
      will-change: opacity; /* Оптимизация */
    }
    
    @keyframes quickFlash {
      0% { opacity: 0.7; }
      100% { opacity: 0; }
    }
    
    /* ТОЧКА УДАРА */
    .tap-hit {
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 4;
      animation: tapHitEffect 0.35s ease-out forwards;
      will-change: transform, opacity; /* Оптимизация */
    }
    
    @keyframes tapHitEffect {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
    }
    
    /* YOU DIED ЭКРАН */
    .you-died-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .you-died-text {
      font-family: 'Times New Roman', serif;
      font-size: 14vw;
      color: #8B0000;
      text-shadow: 
        0 0 30px #8B0000,
        0 0 60px #8B0000,
        0 0 90px #8B0000,
        3px 3px 0 #000,
        5px 5px 0 rgba(0, 0, 0, 0.8);
      margin: 0;
      opacity: 0;
      animation: darkSoulsDeath 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      text-transform: uppercase;
      letter-spacing: 2vw;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      padding: 0 5vw;
      max-width: 100%;
      transform-origin: center center;
    }
    
    @media (max-width: 400px) {
      .you-died-text {
        font-size: 56px;
        letter-spacing: 8px;
      }
    }
    
    @media (min-width: 800px) {
      .you-died-text {
        font-size: 112px;
        letter-spacing: 16px;
      }
    }
    
    @keyframes darkSoulsDeath {
      0% { 
        opacity: 0;
        transform: scale(3);
        filter: blur(50px) brightness(5);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0) brightness(1);
      }
    }
    
    /* КРИТИЧЕСКАЯ ВСПЫШКА */
    .critical-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #8B0000;
      opacity: 0;
      pointer-events: none;
      z-index: 900;
      animation: criticalFlash 1.5s ease-out;
      will-change: opacity; /* Оптимизация */
    }
    
    @keyframes criticalFlash {
      0% { opacity: 0; }
      5% { opacity: 0.8; }
      15% { opacity: 0.7; }
      30% { opacity: 0.5; }
      50% { opacity: 0.3; }
      70% { opacity: 0.15; }
      90% { opacity: 0.05; }
      100% { opacity: 0; }
    }
    
    /* ИНФОРМАЦИЯ О ТАПАХ */
    .tap-info {
      position: absolute;
      top: 100px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    
    .tap-info.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="rage-level" id="rageLevel">😐 СПОКОЙНО</div>
  <div class="tap-info" id="tapInfo">Тапай регулярно, поддерживай темп!</div>
  
  <!-- КОНТЕЙНЕР ДЛЯ ЧАСТИЦ -->
  <div class="particles-container" id="particlesContainer"></div>
  
  <div class="tap-area" id="tapArea"></div>
  
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  
  <button class="exit-btn" onclick="Telegram.WebApp.close()">✖ ЗАКРЫТЬ</button>
  
  <!-- YOU DIED ЭКРАН -->
  <div class="you-died-overlay" id="youDiedOverlay">
    <div class="you-died-text">YOU DIED</div>
  </div>

  <script>
    // =================== ТЕЛЕГРАМ ===================
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    if (Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
    }
    
    // =================== ДАННЫЕ ===================
    let rage = 0;
    let lastTapTime = 0;
    let soundEnabled = false;
    let soundInitialized = false;
    let soundCooldown = false;
    let audioElements = [];
    let youDiedSound = null;
    let currentAudioIndex = 0;
    let firstTapDone = false;
    let youDiedShown = false;
    let decayTimer = null;
    let gameActive = true;
    
    // ОЧЕРЕДИ ДЛЯ ОПТИМИЗАЦИИ
    let particleQueue = [];
    let lastParticleTime = 0;
    let tapCooldown = false;
    let maxParticles = 12; // Ограничиваем количество частиц
    
    // Уровни ярости
    const LEVELS = [
      { emoji: "😐", name: "СПОКОЙНО", color: "#4dabf7", soundChance: 0.1 },
      { emoji: "😠", name: "НАПРЯЖЕНИЕ", color: "#ffa94d", soundChance: 0.15 },
      { emoji: "😡", name: "ЗЛОСТЬ", color: "#ff6b6b", soundChance: 0.2 },
      { emoji: "🤬", name: "ЯРОСТЬ", color: "#ff4757", soundChance: 0.25 },
      { emoji: "💥", name: "БЕШЕНСТВО", color: "#ffcc00", soundChance: 0.3 },
      { emoji: "🔥", name: "ИСТЕРИКА", color: "#ff3838", soundChance: 0.35 }
    ];
    
    // Слова и эмодзи
    const WORDS = [
      "ПИЗДА!", "СУКА!", "ЕБАТЬ!", "НАХУЙ!", "БЛЯТЬ!", "ХУЙ!", 
      "ПИЗДОС!", "ОХУЕТЬ!", "ЗАЕБАЛО!", "ПОШЛИ НАХУЙ!", "ЁПТА!", 
      "БЛЯДЬ!", "УЁБИЩЕ!", "ТВАРЬ!", "ПИЗДЕЦ!", "ЗАЛУПА!", "МРАЗЬ!"
    ];
    const EMOJIS = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡", "🌪", "☠️", "💣", "🧨"];
    
    // =================== DOM ===================
    const tapArea = document.getElementById('tapArea');
    const rageLevelEl = document.getElementById('rageLevel');
    const progressBar = document.getElementById('progressBar');
    const youDiedOverlay = document.getElementById('youDiedOverlay');
    const tapInfo = document.getElementById('tapInfo');
    const particlesContainer = document.getElementById('particlesContainer');
    
    // =================== ОПТИМИЗАЦИЯ ЧАСТИЦ ===================
    function cleanupParticles() {
      // Автоматическая очистка старых частиц
      const particles = particlesContainer.querySelectorAll('.rage-particle');
      if (particles.length > maxParticles) {
        const toRemove = particles.length - maxParticles;
        for (let i = 0; i < toRemove; i++) {
          if (particles[i]) {
            particles[i].remove();
          }
        }
      }
    }
    
    // =================== ЗВУК ===================
    function initSoundOnFirstTap() {
      if (soundInitialized) return;
      
      // Звуки ударов
      for (let i = 0; i < 3; i++) {
        const audio = new Audio();
        audio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
        audio.preload = "auto";
        audio.volume = 0.5;
        audioElements.push(audio);
      }
      
      // Звук YOU DIED
      youDiedSound = new Audio();
      youDiedSound.src = "https://veedva.github.io/weedkent_bot/dark-souls-you-died.mp3";
      youDiedSound.preload = "auto";
      youDiedSound.volume = 0.8;
      
      soundInitialized = true;
      soundEnabled = true;
    }
    
    function playDamageSound() {
      if (!soundEnabled || soundCooldown) return;
      
      const level = getCurrentLevel();
      if (Math.random() > level.soundChance) return;
      
      try {
        const audio = audioElements[currentAudioIndex];
        currentAudioIndex = (currentAudioIndex + 1) % audioElements.length;
        
        audio.currentTime = 0;
        audio.volume = 0.4 + (rage / 300);
        audio.play().catch(() => {});
        
        soundCooldown = true;
        setTimeout(() => { soundCooldown = false; }, 150);
      } catch (error) {}
    }
    
    function playYouDiedSound() {
      if (!soundEnabled || !youDiedSound) return;
      
      try {
        setTimeout(() => {
          youDiedSound.currentTime = 0;
          youDiedSound.volume = 0.8;
          youDiedSound.play().catch(() => {});
        }, 400);
      } catch (error) {}
    }
    
    // =================== ОСНОВНЫЕ ФУНКЦИИ ===================
    function getCurrentLevel() {
      const index = Math.floor(rage / 20);
      return LEVELS[Math.min(index, LEVELS.length - 1)];
    }
    
    function updateUI() {
      const level = getCurrentLevel();
      rageLevelEl.textContent = `${level.emoji} ${level.name}`;
      rageLevelEl.style.color = level.color;
      rageLevelEl.style.textShadow = `0 0 20px ${level.color}`;
      progressBar.style.width = `${rage}%`;
      progressBar.style.background = `linear-gradient(90deg, ${level.color}, #ffcc00)`;
    }
    
    function updateTapInfo(message) {
      tapInfo.textContent = message;
      tapInfo.classList.add('show');
      
      setTimeout(() => {
        tapInfo.classList.remove('show');
      }, 1500);
    }
    
    function createTapHit(x, y) {
      const hit = document.createElement('div');
      hit.className = 'tap-hit';
      hit.style.left = `${x}px`;
      hit.style.top = `${y}px`;
      
      const level = getCurrentLevel();
      hit.style.background = level.color;
      
      document.body.appendChild(hit);
      setTimeout(() => {
        if (hit.parentNode) hit.remove();
      }, 350);
    }
    
    function createParticle(x, y, isEmoji) {
      const now = Date.now();
      
      // Ограничение частоты создания частиц
      if (now - lastParticleTime < 50) {
        // Добавляем в очередь, если слишком быстро
        particleQueue.push({ x, y, isEmoji, time: now });
        return;
      }
      
      lastParticleTime = now;
      
      const particle = document.createElement('div');
      particle.className = `rage-particle ${isEmoji ? 'rage-emoji' : 'rage-word'}`;
      particle.textContent = isEmoji 
        ? EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
        : WORDS[Math.floor(Math.random() * WORDS.length)];
      
      const intensity = Math.min(rage / 100, 1);
      
      // Более консервативные размеры
      const baseSize = isEmoji ? 30 : 24;
      const sizeMultiplier = 0.8 + (intensity * 0.8);
      const fontSize = Math.floor(baseSize * sizeMultiplier);
      particle.style.fontSize = `${fontSize}px`;
      
      // Более короткая анимация
      const baseDistance = 50;
      const distanceMultiplier = 0.7 + (intensity * 1.2);
      
      const angle = Math.random() * Math.PI * 2;
      const distance = baseDistance * distanceMultiplier;
      
      particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
      particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
      particle.style.setProperty('--rot', `${Math.random() * 30 - 15}deg`);
      particle.style.setProperty('--scale', sizeMultiplier);
      
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      
      const level = getCurrentLevel();
      particle.style.color = level.color;
      
      particlesContainer.appendChild(particle);
      
      // Автоматическое удаление
      setTimeout(() => {
        if (particle.parentNode) {
          particle.remove();
        }
      }, 1200);
      
      cleanupParticles();
      
      // Обрабатываем очередь
      if (particleQueue.length > 0) {
        const next = particleQueue.shift();
        if (next && now - next.time < 500) {
          setTimeout(() => createParticle(next.x, next.y, next.isEmoji), 50);
        }
      }
    }
    
    function createFlash() {
      const flash = document.createElement('div');
      flash.className = 'screen-flash';
      
      const level = getCurrentLevel();
      const intensity = Math.min(rage / 100, 1);
      const opacity = 0.15 + (intensity * 0.25);
      
      flash.style.background = `rgba(${parseInt(level.color.slice(1,3), 16)}, ${parseInt(level.color.slice(3,5), 16)}, ${parseInt(level.color.slice(5,7), 16)}, ${opacity})`;
      
      document.body.appendChild(flash);
      setTimeout(() => {
        if (flash.parentNode) flash.remove();
      }, 250);
    }
    
    function createCriticalFlash() {
      const flash = document.createElement('div');
      flash.className = 'critical-flash';
      document.body.appendChild(flash);
      setTimeout(() => {
        if (flash.parentNode) flash.remove();
      }, 1500);
    }
    
    function showYouDied() {
      if (youDiedShown) return;
      youDiedShown = true;
      gameActive = false;
      
      tapArea.style.pointerEvents = 'none';
      
      createCriticalFlash();
      playYouDiedSound();
      
      if (navigator.vibrate) {
        navigator.vibrate([500, 150, 500]);
      }
      
      setTimeout(() => {
        youDiedOverlay.style.display = 'flex';
        rageLevelEl.style.display = 'none';
        progressBar.parentElement.style.display = 'none';
        tapInfo.style.display = 'none';
      }, 250);
    }
    
    // СБРОС ЯРОСТИ
    function startDecay() {
      if (decayTimer) clearTimeout(decayTimer);
      
      decayTimer = setTimeout(() => {
        if (rage > 0) {
          const decayRate = 1.5 + (rage / 40);
          rage = Math.max(rage - decayRate, 0);
          
          if (gameActive) {
            updateUI();
          }
          
          if (rage > 0) {
            startDecay();
          }
        }
      }, 100);
    }
    
    function handleTap(x, y) {
      if (!gameActive || tapCooldown) return;
      
      // Защита от спама
      tapCooldown = true;
      setTimeout(() => { tapCooldown = false; }, 50);
      
      if (!firstTapDone) {
        firstTapDone = true;
        initSoundOnFirstTap();
      }
      
      if (rage >= 100 && !youDiedShown) {
        showYouDied();
        return;
      }
      
      const now = Date.now();
      const timeDiff = lastTapTime === 0 ? 1000 : now - lastTapTime;
      lastTapTime = now;
      
      // БАЛАНСИРОВКА
      let rageGain = 3; // Уменьшили базовый прирост
      
      // Мягкий бонус за скорость (не слишком агрессивный)
      if (timeDiff < 400) {
        rageGain += Math.min(Math.floor(400 / timeDiff), 3);
      }
      
      // Кап на максимальный прирост
      rageGain = Math.min(rageGain, 6);
      
      rage = Math.min(rage + rageGain, 100);
      
      // ЗВУК
      playDamageSound();
      
      // ВИЗУАЛЬНЫЕ ЭФФЕКТЫ
      createTapHit(x, y);
      createFlash();
      
      // ЧАСТИЦЫ (умеренное количество)
      const particleCount = rage > 70 ? 3 : (rage > 40 ? 2 : 1);
      
      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          const offsetX = (Math.random() * 40 - 20);
          const offsetY = (Math.random() * 40 - 20);
          
          createParticle(x + offsetX, y + offsetY, i % 2 === 0);
        }, i * 60); // Увеличили задержку между частицами
      }
      
      // ВИБРАЦИЯ (короче)
      if (navigator.vibrate) {
        const intensity = Math.min(rage / 100, 1);
        const duration = Math.floor(8 + intensity * 15);
        navigator.vibrate(duration);
      }
      
      updateUI();
      startDecay();
    }
    
    // =================== ОБРАБОТЧИКИ ===================
    tapArea.addEventListener('click', function(e) {
      handleTap(e.clientX, e.clientY);
    });
    
    tapArea.addEventListener('touchstart', function(e) {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });
    
    // =================== ИНИЦИАЛИЗАЦИЯ ===================
    updateUI();
    
    setTimeout(() => {
      if (rage === 0) {
        updateTapInfo("Тапай по экрану!");
      }
    }, 1000);
    
    startDecay();
    
    // Регулярная очистка
    setInterval(cleanupParticles, 2000);
    
    // Очистка при скрытии вкладки
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        const particles = particlesContainer.querySelectorAll('.rage-particle');
        particles.forEach(p => p.remove());
        particleQueue = [];
      }
    });
  </script>
</body>
</html>
