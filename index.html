<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤬 ПИЗДЕЦ-ГЕНЕРАТОР</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Сброс стилей для мобилок */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent; /* Убираем синее выделение при тапе */
      -webkit-user-select: none;
      user-select: none;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
      color: white;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation; /* Улучшает тач-события */
      position: relative;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    
    /* Заголовок */
    .header {
      text-align: center;
      padding-top: 20px;
      width: 100%;
    }
    
    h1 {
      font-size: 28px;
      color: #ff4757;
      text-shadow: 0 0 15px rgba(255, 71, 87, 0.5);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    
    .subtitle {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 20px;
    }
    
    /* Основная кнопка - ОГРОМНАЯ для пальцев */
    #rage-button {
      width: 85vw;
      height: 85vw;
      max-width: 300px;
      max-height: 300px;
      min-width: 250px;
      min-height: 250px;
      
      background: radial-gradient(circle at 30% 30%, #ff4757 0%, #c23636 100%);
      border: none;
      border-radius: 50%;
      
      color: white;
      font-size: 32px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      
      cursor: pointer;
      margin: 10px 0;
      
      transition: all 0.1s ease;
      transform: scale(1);
      
      box-shadow: 
        0 10px 30px rgba(255, 71, 87, 0.4),
        0 0 0 0 rgba(255, 71, 87, 0.1), /* Для анимации пульсации */
        inset 0 -8px 20px rgba(0, 0, 0, 0.3),
        inset 0 8px 20px rgba(255, 255, 255, 0.1);
      
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      
      /* Убираем стандартные стили */
      outline: none;
      -webkit-appearance: none;
    }
    
    /* Анимация нажатия */
    #rage-button:active {
      transform: scale(0.95);
      box-shadow: 
        0 5px 15px rgba(255, 71, 87, 0.6),
        0 0 0 20px rgba(255, 71, 87, 0.1),
        inset 0 -4px 10px rgba(0, 0, 0, 0.4),
        inset 0 4px 10px rgba(255, 255, 255, 0.2);
    }
    
    /* Внутренний текст кнопки */
    .button-text {
      position: relative;
      z-index: 2;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }
    
    /* Эффект свечения внутри кнопки */
    .button-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.3) 0%, transparent 70%);
      opacity: 0;
      border-radius: 50%;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    
    /* Вылетающие слова - БОЛЬШИЕ и МЕДЛЕННЫЕ */
    .swear-word {
      position: absolute;
      pointer-events: none;
      font-size: 28px; /* Увеличили */
      font-weight: 900;
      z-index: 100;
      text-shadow: 
        0 0 10px currentColor,
        0 0 20px currentColor,
        2px 2px 0 rgba(0, 0, 0, 0.5);
      opacity: 1;
      animation: floatUp 3s ease-out forwards; /* Увеличили время в 2 раза */
      white-space: nowrap;
    }
    
    /* Анимация вылета */
    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: 
          translate(0, 0) 
          rotate(0deg) 
          scale(1);
        filter: blur(0);
      }
      50% {
        opacity: 1;
        transform: 
          translate(var(--move-x), var(--move-y)) 
          rotate(var(--rotate)) 
          scale(1.5); /* Увеличиваем в полёте */
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform: 
          translate(calc(var(--move-x) * 1.5), calc(var(--move-y) * 1.5)) 
          rotate(calc(var(--rotate) * 2)) 
          scale(0.5);
        filter: blur(2px);
      }
    }
    
    /* Эмодзи - отдельная анимация */
    .emoji-particle {
      position: absolute;
      pointer-events: none;
      font-size: 40px; /* Увеличили */
      z-index: 100;
      opacity: 1;
      animation: emojiFloat 4s ease-out forwards; /* Ещё медленнее */
    }
    
    @keyframes emojiFloat {
      0% {
        opacity: 1;
        transform: 
          translate(0, 0) 
          rotate(0deg) 
          scale(0.8);
      }
      30% {
        opacity: 1;
        transform: 
          translate(var(--emoji-x), var(--emoji-y)) 
          rotate(var(--emoji-rotate)) 
          scale(1.8); /* Большое увеличение */
      }
      100% {
        opacity: 0;
        transform: 
          translate(calc(var(--emoji-x) * 1.8), calc(var(--emoji-y) * 1.8)) 
          rotate(calc(var(--emoji-rotate) * 3)) 
          scale(0.3);
      }
    }
    
    /* Эффект взрыва */
    .explosion {
      position: absolute;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 71, 87, 0.8) 0%, transparent 70%);
      opacity: 0;
      pointer-events: none;
      animation: explode 0.6s ease-out;
    }
    
    @keyframes explode {
      0% {
        opacity: 1;
        transform: scale(0.1);
      }
      50% {
        opacity: 0.7;
        transform: scale(2);
      }
      100% {
        opacity: 0;
        transform: scale(4);
      }
    }
    
    /* Конфетти */
    .confetti {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #ff4757;
      opacity: 0;
      animation: confettiFall 2s linear forwards;
      border-radius: 2px;
    }
    
    @keyframes confettiFall {
      0% {
        opacity: 1;
        transform: translateY(-100px) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translateY(100vh) rotate(720deg);
      }
    }
    
    /* Статистика внизу (можно убрать, но оставил минимальную) */
    .stats {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 400px;
      padding: 15px;
      background: rgba(255, 71, 87, 0.1);
      border-radius: 20px;
      border: 1px solid rgba(255, 71, 87, 0.2);
      margin: 10px 0;
      opacity: 0.7; /* Полупрозрачная, не отвлекает */
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #ffcc00;
    }
    
    .stat-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }
    
    /* Кнопка закрытия */
    #close-btn {
      background: rgba(255, 71, 87, 0.2);
      color: white;
      border: 2px solid rgba(255, 71, 87, 0.5);
      padding: 14px 40px;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin: 20px 0;
      transition: all 0.3s;
      outline: none;
      -webkit-appearance: none;
      width: 80%;
      max-width: 300px;
    }
    
    #close-btn:active {
      background: rgba(255, 71, 87, 0.4);
      transform: scale(0.98);
    }
    
    /* Ачивки */
    .achievement-notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(45deg, #ff4757, #ffcc00);
      color: black;
      padding: 15px 25px;
      border-radius: 15px;
      font-weight: bold;
      font-size: 18px;
      text-align: center;
      z-index: 1000;
      box-shadow: 0 5px 20px rgba(255, 71, 87, 0.5);
      animation: slideDown 3s ease-in-out forwards;
      display: none;
    }
    
    @keyframes slideDown {
      0% {
        top: -100px;
        opacity: 0;
      }
      15% {
        top: 20px;
        opacity: 1;
      }
      85% {
        top: 20px;
        opacity: 1;
      }
      100% {
        top: -100px;
        opacity: 0;
      }
    }
    
    /* Вибро-эффект для телефона */
    @media (hover: none) and (pointer: coarse) {
      #rage-button {
        cursor: default;
      }
    }
    
    /* Адаптивность */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px;
      }
      
      #rage-button {
        width: 80vw;
        height: 80vw;
        font-size: 28px;
      }
      
      .swear-word {
        font-size: 24px;
      }
      
      .emoji-particle {
        font-size: 36px;
      }
    }
    
    @media (max-height: 700px) {
      .header {
        padding-top: 10px;
      }
      
      #rage-button {
        width: 70vw;
        height: 70vw;
        max-width: 250px;
        max-height: 250px;
      }
      
      .stats {
        margin: 5px 0;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🤬 ПИЗДЕЦ-ГЕНЕРАТОР</h1>
    <div class="subtitle">БЕЙ КНОПКУ И ВЫПУСКАЙ ПАР</div>
  </div>
  
  <button id="rage-button">
    <div class="button-text">ПИЗДЕЦ!</div>
    <div class="button-glow" id="buttonGlow"></div>
  </button>
  
  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="streak">0</div>
      <div class="stat-label">серия</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="total">0</div>
      <div class="stat-label">всего</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="power">🔥</div>
      <div class="stat-label">мощь</div>
    </div>
  </div>
  
  <button id="close-btn">✖ ЗАКРЫТЬ</button>
  
  <div class="achievement-notification" id="achievement">
    🎉 АЧИВКА! <span id="achievement-text"></span>
  </div>
  
  <script>
    // Telegram WebApp
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    if (Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => {
        Telegram.WebApp.close();
      });
    }
    
    // Данные
    let totalClicks = 0;
    let streak = 0;
    let streakTimeout;
    const achievements = [
      { count: 10, text: "ПИЗДЕЦ-НОВИЧОК" },
      { count: 30, text: "МАСТЕР ГНЕВА" },
      { count: 50, text: "ЛЕГЕНДА РЕЛАКСА" },
      { count: 100, text: "БОГ СПОКОЙСТВИЯ" }
    ];
    let unlockedAchievements = [];
    
    // Слова и эмодзи
    const SWEAR_WORDS = [
      "ПИЗДА!", "СУКА!", "ЕБАТЬ!", "НАХУЙ!", "БЛЯТЬ!", 
      "ХУЙНЯ!", "ЁБАНЫЙ!", "ПИЗДЕЦ!", "ОХУЕТЬ!", "ЗАЕБАЛО!",
      "ПОШЛО НАХУЙ!", "ЁПТА!", "БЛЯДЬ!", "ХУЁВО!", "ЕБЁНЫЙ!"
    ];
    
    const ANGRY_EMOJIS = [
      "💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡", "🌪", "☠️",
      "😤", "🤯", "👹", "😾", "🗯️", "💣", "🧨", "🖕", "💀", "🦹"
    ];
    
    // DOM элементы
    const rageButton = document.getElementById('rage-button');
    const buttonGlow = document.getElementById('buttonGlow');
    const closeBtn = document.getElementById('close-btn');
    const streakElement = document.getElementById('streak');
    const totalElement = document.getElementById('total');
    const powerElement = document.getElementById('power');
    const achievementElement = document.getElementById('achievement');
    const achievementText = document.getElementById('achievement-text');
    
    // Обновить статистику
    function updateStats() {
      streakElement.textContent = streak;
      totalElement.textContent = totalClicks;
      
      // Меняем эмодзи силы в зависимости от серии
      const powerLevels = ["😐", "😠", "😡", "🤬", "💥", "🔥", "☠️"];
      const powerIndex = Math.min(streak, powerLevels.length - 1);
      powerElement.textContent = powerLevels[powerIndex];
      
      // Меняем цвет кнопки
      const hue = (totalClicks * 5) % 360;
      rageButton.style.background = `
        radial-gradient(circle at 30% 30%, 
          hsl(${hue}, 100%, 60%) 0%, 
          hsl(${hue}, 80%, 40%) 100%)
      `;
    }
    
    // Создать вылетающее слово
    function createSwearWord(x, y) {
      const word = document.createElement('div');
      word.className = 'swear-word';
      word.textContent = SWEAR_WORDS[Math.floor(Math.random() * SWEAR_WORDS.length)];
      word.style.color = `hsl(${Math.random() * 360}, 100%, 65%)`;
      
      // Случайное направление
      const angle = Math.random() * Math.PI * 2;
      const distance = 150 + Math.random() * 200;
      word.style.setProperty('--move-x', Math.cos(angle) * distance + 'px');
      word.style.setProperty('--move-y', Math.sin(angle) * distance + 'px');
      word.style.setProperty('--rotate', (Math.random() * 60 - 30) + 'deg');
      
      word.style.left = (x - 50) + 'px';
      word.style.top = (y - 25) + 'px';
      
      document.body.appendChild(word);
      setTimeout(() => word.remove(), 3000);
    }
    
    // Создать вылетающий эмодзи
    function createEmoji(x, y) {
      const emoji = document.createElement('div');
      emoji.className = 'emoji-particle';
      emoji.textContent = ANGRY_EMOJIS[Math.floor(Math.random() * ANGRY_EMOJIS.length)];
      
      const angle = Math.random() * Math.PI * 2;
      const distance = 100 + Math.random() * 150;
      emoji.style.setProperty('--emoji-x', Math.cos(angle) * distance + 'px');
      emoji.style.setProperty('--emoji-y', Math.sin(angle) * distance + 'px');
      emoji.style.setProperty('--emoji-rotate', (Math.random() * 360) + 'deg');
      
      emoji.style.left = (x - 20) + 'px';
      emoji.style.top = (y - 20) + 'px';
      
      document.body.appendChild(emoji);
      setTimeout(() => emoji.remove(), 4000);
    }
    
    // Создать эффект взрыва
    function createExplosion(x, y) {
      const explosion = document.createElement('div');
      explosion.className = 'explosion';
      explosion.style.left = (x - 50) + 'px';
      explosion.style.top = (y - 50) + 'px';
      
      document.body.appendChild(explosion);
      setTimeout(() => explosion.remove(), 600);
    }
    
    // Создать конфетти
    function createConfetti(x, y) {
      const count = 15;
      for (let i = 0; i < count; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.background = `hsl(${Math.random() * 360}, 100%, 60%)`;
        confetti.style.left = (x - 6) + 'px';
        confetti.style.top = (y - 6) + 'px';
        confetti.style.animationDelay = (Math.random() * 0.5) + 's';
        
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 2000);
      }
    }
    
    // Показать ачивку
    function showAchievement(text) {
      achievementText.textContent = text;
      achievementElement.style.display = 'block';
      
      setTimeout(() => {
        achievementElement.style.display = 'none';
      }, 3000);
    }
    
    // Проверить ачивки
    function checkAchievements() {
      achievements.forEach(ach => {
        if (totalClicks >= ach.count && !unlockedAchievements.includes(ach.count)) {
          unlockedAchievements.push(ach.count);
          showAchievement(ach.text);
        }
      });
    }
    
    // Обработчик нажатия
    rageButton.addEventListener('click', function(e) {
      totalClicks++;
      streak++;
      
      // Координаты нажатия (для мобилок - центр кнопки)
      const rect = this.getBoundingClientRect();
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      
      // Эффекты
      createExplosion(x, y);
      createSwearWord(x, y);
      createEmoji(x, y);
      if (streak % 5 === 0) createConfetti(x, y);
      
      // Анимация кнопки
      buttonGlow.style.opacity = '0.8';
      setTimeout(() => {
        buttonGlow.style.opacity = '0';
      }, 300);
      
      // Вибрация (если доступно)
      if (navigator.vibrate) {
        navigator.vibrate(50);
      }
      
      // Обновить статистику
      updateStats();
      checkAchievements();
      
      // Сброс серии через 3 секунды
      clearTimeout(streakTimeout);
      streakTimeout = setTimeout(() => {
        streak = 0;
        updateStats();
      }, 3000);
    });
    
    // Тач-события для мобилок
    rageButton.addEventListener('touchstart', function(e) {
      e.preventDefault();
      this.style.transform = 'scale(0.95)';
    });
    
    rageButton.addEventListener('touchend', function(e) {
      e.preventDefault();
      this.style.transform = 'scale(1)';
    });
    
    // Закрыть приложение
    closeBtn.addEventListener('click', function() {
      Telegram.WebApp.close();
    });
    
    // Инициализация
    updateStats();
  </script>
</body>
</html>
