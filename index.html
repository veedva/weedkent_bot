<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🤬 БЕСКОНЕЧНЫЙ КАТАРСИС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    @import url('https://fonts.cdnfonts.com/css/optimustime');
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      touch-action: manipulation;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      width: 100vw;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    
    /* ЭКРАН ДЛЯ ТАПОВ */
    .tap-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
    
    /* УРОВЕНЬ ЯРОСТИ */
    .rage-level {
      position: absolute;
      top: 70px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      z-index: 10;
      color: #ffcc00;
      text-shadow: 0 0 15px #ffcc00;
      pointer-events: none;
      transition: all 0.3s ease;
      font-family: 'Arial Black', Impact, sans-serif;
    }
    
    /* ПРОГРЕСС БАР */
    .progress-container {
      position: absolute;
      bottom: 90px;
      left: 30px;
      right: 30px;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #ff4757, #ffcc00);
      width: 0%;
      transition: width 0.2s ease-out;
      border-radius: 6px;
    }
    
    /* КНОПКА ВЫХОДА */
    .exit-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 35px;
      border-radius: 25px;
      font-size: 17px;
      z-index: 10;
      cursor: pointer;
      backdrop-filter: blur(5px);
      border: none;
      -webkit-appearance: none;
      -webkit-tap-highlight-color: rgba(255,255,255,0.3);
      touch-action: manipulation;
    }
    
    /* ВЫЛЕТАЮЩИЕ СЛОВА */
    .rage-particle {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
      font-weight: 900;
      animation: particleFloat 2.2s ease-out forwards;
      text-shadow: 0 0 15px currentColor, 0 0 30px rgba(255, 255, 255, 0.3);
    }
    
    .rage-word {
      font-size: 42px;
      font-family: 'Arial Black', Impact, sans-serif;
      letter-spacing: 1px;
    }
    
    .rage-emoji {
      font-size: 52px;
    }
    
    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8) rotate(0deg);
      }
      25% {
        opacity: 1;
        transform: translate(var(--dx), var(--dy)) scale(1.8) rotate(var(--rot));
      }
      50% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.5), calc(var(--dy) * 1.5)) scale(0.4) rotate(calc(var(--rot) * 2));
      }
    }
    
    /* ВСПЫШКА */
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 71, 87, 0.25);
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: quickFlash 0.3s ease-out;
    }
    
    @keyframes quickFlash {
      0% { opacity: 0.7; }
      100% { opacity: 0; }
    }
    
    /* YOU DIED ЭКРАН */
    .you-died {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .you-died-text {
      font-family: 'OptimusTime', 'Times New Roman', serif;
      font-size: 100px;
      color: #8B0000;
      text-shadow: 
        0 0 10px #8B0000,
        0 0 20px #8B0000,
        0 0 30px #8B0000,
        2px 2px 0 #000,
        3px 3px 0 rgba(0, 0, 0, 0.8);
      text-transform: uppercase;
      letter-spacing: 15px;
      text-align: center;
      opacity: 0;
      animation: darkSoulsAppear 3.5s ease-out forwards;
      line-height: 1;
      padding: 20px;
    }
    
    @keyframes darkSoulsAppear {
      0% { 
        opacity: 0;
        transform: scale(3);
        filter: blur(20px) brightness(3);
      }
      10% {
        opacity: 0.3;
        transform: scale(2.8);
        filter: blur(15px) brightness(2.5);
      }
      20% {
        opacity: 0.5;
        transform: scale(2.5);
        filter: blur(12px) brightness(2);
      }
      30% {
        opacity: 0.7;
        transform: scale(2.2);
        filter: blur(9px) brightness(1.8);
      }
      40% {
        opacity: 0.8;
        transform: scale(1.9);
        filter: blur(6px) brightness(1.6);
      }
      50% {
        opacity: 0.9;
        transform: scale(1.6);
        filter: blur(4px) brightness(1.4);
      }
      60% {
        opacity: 0.95;
        transform: scale(1.3);
        filter: blur(2px) brightness(1.2);
      }
      70% {
        opacity: 1;
        transform: scale(1.1);
        filter: blur(1px) brightness(1.1);
      }
      80% {
        opacity: 1;
        transform: scale(1.05);
        filter: blur(0.5px) brightness(1.05);
      }
      90% {
        opacity: 1;
        transform: scale(1.02);
        filter: blur(0) brightness(1);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0) brightness(1);
      }
    }
    
    /* КРИТИЧЕСКАЯ ВСПЫШКА */
    .critical-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #8B0000;
      opacity: 0;
      pointer-events: none;
      z-index: 900;
      animation: criticalFlash 1.5s ease-out;
    }
    
    @keyframes criticalFlash {
      0% { opacity: 0.9; }
      20% { opacity: 0.8; }
      40% { opacity: 0.5; }
      60% { opacity: 0.3; }
      80% { opacity: 0.1; }
      100% { opacity: 0; }
    }
    
    /* ПУЛЬСАЦИЯ ПРИ КЛИКЕ */
    .tap-ripple {
      position: absolute;
      border: 2px solid;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 3;
      animation: rippleEffect 1s ease-out forwards;
    }
    
    @keyframes rippleEffect {
      0% {
        width: 20px;
        height: 20px;
        opacity: 0.8;
      }
      100% {
        width: 200px;
        height: 200px;
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="rage-level" id="rageLevel">😐 СПОКОЙНО</div>
  
  <div class="tap-area" id="tapArea"></div>
  
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  
  <button class="exit-btn" onclick="Telegram.WebApp.close()">✖ ВЫЙТИ</button>
  
  <div class="you-died" id="youDied">
    <div class="you-died-text">YOU DIED</div>
  </div>

  <script>
    // =================== ТЕЛЕГРАМ ===================
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    Telegram.WebApp.BackButton.hide();
    
    // =================== ДАННЫЕ ===================
    let rage = 0;
    let lastTapTime = 0;
    let activeParticles = 0;
    const MAX_PARTICLES = 12;
    let soundEnabled = false;
    let soundInitialized = false;
    let soundCooldown = false;
    let audioElements = [];
    let youDiedSound = null;
    let currentAudioIndex = 0;
    let firstTapDone = false;
    let youDiedShown = false;
    let decayTimer = null;
    let gameActive = true;
    let isTouching = false;
    
    // Уровни ярости - теперь меньше уровней и они меняются реже
    const LEVELS = [
      { emoji: "😐", name: "СПОКОЙНО", color: "#4dabf7", soundChance: 0.1, rageMin: 0, rageMax: 30 },
      { emoji: "😠", name: "НАПРЯЖЕНИЕ", color: "#ffa94d", soundChance: 0.15, rageMin: 30, rageMax: 50 },
      { emoji: "😡", name: "ЗЛОСТЬ", color: "#ff6b6b", soundChance: 0.2, rageMin: 50, rageMax: 70 },
      { emoji: "🤬", name: "ЯРОСТЬ", color: "#ff4757", soundChance: 0.25, rageMin: 70, rageMax: 85 },
      { emoji: "💀", name: "БЕШЕНСТВО", color: "#ffcc00", soundChance: 0.3, rageMin: 85, rageMax: 95 },
      { emoji: "🔥", name: "КРИТИЧЕСКИЙ", color: "#ff3838", soundChance: 0.35, rageMin: 95, rageMax: 100 }
    ];
    
    // Слова и эмодзи
    const WORDS = [
      "ПИЗДА!", "СУКА!", "ЕБАТЬ!", "НАХУЙ!", "БЛЯТЬ!", "ХУЙНЯ!", 
      "ЁБАНЫЙ!", "ОХУЕТЬ!", "ЗАЕБАЛО!", "ПОШЛО НАХУЙ!", "ЁПТА!", 
      "БЛЯДЬ!", "ХУЁВО!", "ЕБЁНЫЙ!", "ПИЗДЕЦ!", "ВЪЕБАТЬ!", "ПРОЕБАТЬ!"
    ];
    const EMOJIS = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡", "🌪", "☠️", "💣", "🧨"];
    
    // =================== DOM ===================
    const tapArea = document.getElementById('tapArea');
    const rageLevelEl = document.getElementById('rageLevel');
    const progressBar = document.getElementById('progressBar');
    const youDiedScreen = document.getElementById('youDied');
    
    // =================== ЗВУК ===================
    function initSoundOnFirstTap() {
      if (soundInitialized) return;
      
      // Звуки ударов
      for (let i = 0; i < 2; i++) {
        const audio = new Audio();
        audio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
        audio.preload = "auto";
        audio.volume = 0.5;
        audioElements.push(audio);
      }
      
      // Звук YOU DIED
      youDiedSound = new Audio();
      youDiedSound.src = "https://veedva.github.io/weedkent_bot/dark-souls-you-died.mp3";
      youDiedSound.preload = "auto";
      youDiedSound.volume = 0.8;
      
      soundInitialized = true;
      soundEnabled = true;
      
      // Предзагрузка звука
      setTimeout(() => {
        try {
          const testAudio = new Audio();
          testAudio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
          testAudio.volume = 0.03;
          testAudio.play().catch(() => {});
        } catch (e) {}
      }, 100);
    }
    
    function playDamageSound() {
      if (!soundEnabled || soundCooldown) return;
      
      const level = getCurrentLevel();
      if (Math.random() > level.soundChance) return;
      
      try {
        const audio = audioElements[currentAudioIndex];
        currentAudioIndex = (currentAudioIndex + 1) % audioElements.length;
        
        audio.currentTime = 0;
        audio.volume = 0.4 + (rage / 250);
        audio.play().catch(() => {});
        
        soundCooldown = true;
        setTimeout(() => { soundCooldown = false; }, 400);
      } catch (error) {}
    }
    
    function playYouDiedSound() {
      if (!soundEnabled || !youDiedSound) return;
      
      try {
        youDiedSound.currentTime = 0;
        youDiedSound.volume = 0.8;
        youDiedSound.play().catch(() => {});
      } catch (error) {}
    }
    
    // =================== ОСНОВНЫЕ ФУНКЦИИ ===================
    function getCurrentLevel() {
      for (let i = LEVELS.length - 1; i >= 0; i--) {
        if (rage >= LEVELS[i].rageMin) {
          return LEVELS[i];
        }
      }
      return LEVELS[0];
    }
    
    function updateUI() {
      if (!gameActive) return;
      
      const level = getCurrentLevel();
      rageLevelEl.textContent = `${level.emoji} ${level.name}`;
      rageLevelEl.style.color = level.color;
      rageLevelEl.style.textShadow = `0 0 20px ${level.color}`;
      progressBar.style.width = `${rage}%`;
      progressBar.style.background = `linear-gradient(90deg, ${level.color}, #ffcc00)`;
    }
    
    function getTapSpeedBonus(timeDiff) {
      // Супер-быстрые тапы (менее 50ms) = максимальный бонус
      if (timeDiff < 50) return 9;
      // Быстрые тапы (50-100ms) = хороший бонус
      if (timeDiff < 100) return 7;
      // Средние тапы (100-200ms) = небольшой бонус
      if (timeDiff < 200) return 4;
      // Медленные тапы (200-400ms) = без бонуса
      if (timeDiff < 400) return 1;
      // Очень медленные тапы = штраф!
      if (timeDiff < 800) return -3;
      // Совсем медленные = большой штраф
      return -6;
    }
    
    function createParticle(x, y, isEmoji) {
      if (activeParticles >= MAX_PARTICLES || !gameActive) return;
      
      activeParticles++;
      
      const particle = document.createElement('div');
      particle.className = `rage-particle ${isEmoji ? 'rage-emoji' : 'rage-word'}`;
      particle.textContent = isEmoji 
        ? EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
        : WORDS[Math.floor(Math.random() * WORDS.length)];
      
      const angle = Math.random() * Math.PI * 2;
      const distance = 80 + Math.random() * 140 * (rage / 100);
      particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
      particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
      particle.style.setProperty('--rot', `${Math.random() * 60 - 30}deg`);
      
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      
      const level = getCurrentLevel();
      particle.style.color = level.color;
      
      document.body.appendChild(particle);
      
      setTimeout(() => {
        if (particle.parentNode) {
          particle.remove();
          activeParticles--;
        }
      }, 2200);
    }
    
    function createFlash() {
      if (!gameActive) return;
      
      const flash = document.createElement('div');
      flash.className = 'screen-flash';
      
      const level = getCurrentLevel();
      flash.style.background = `rgba(${parseInt(level.color.slice(1,3), 16)}, ${parseInt(level.color.slice(3,5), 16)}, ${parseInt(level.color.slice(5,7), 16)}, 0.3)`;
      
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 300);
    }
    
    function createCriticalFlash() {
      const flash = document.createElement('div');
      flash.className = 'critical-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 1500);
    }
    
    function showYouDied() {
      if (youDiedShown) return;
      youDiedShown = true;
      gameActive = false;
      
      // Отключаем тап-область
      tapArea.style.pointerEvents = 'none';
      
      // Скрываем UI
      rageLevelEl.style.display = 'none';
      progressBar.parentElement.style.display = 'none';
      
      // Критическая вспышка
      createCriticalFlash();
      
      // Звук YOU DIED (с небольшой задержкой как в игре)
      setTimeout(() => {
        playYouDiedSound();
      }, 300);
      
      // Показываем экран YOU DIED
      setTimeout(() => {
        youDiedScreen.style.display = 'flex';
      }, 500);
      
      // Мощная вибрация
      if (navigator.vibrate) {
        setTimeout(() => {
          navigator.vibrate([500, 100, 500, 100, 500]);
        }, 400);
      }
    }
    
    // СБРОС ЯРОСТИ - теперь быстрее!
    function startDecay() {
      if (decayTimer) clearTimeout(decayTimer);
      
      decayTimer = setTimeout(() => {
        if (rage > 0 && gameActive) {
          // Чем выше уровень ярости, тем быстрее она спадает
          const decayRate = 2.5 + (rage / 18);
          rage = Math.max(rage - decayRate, 0);
          updateUI();
          
          if (rage > 0) {
            startDecay();
          }
        }
      }, 100);
    }
    
    function handleTap(x, y) {
      if (!gameActive) return;
      
      if (!firstTapDone) {
        firstTapDone = true;
        initSoundOnFirstTap();
      }
      
      if (rage >= 100 && !youDiedShown) {
        showYouDied();
        return;
      }
      
      const now = Date.now();
      const timeDiff = lastTapTime === 0 ? 400 : now - lastTapTime;
      lastTapTime = now;
      
      // БАЗОВЫЙ ПРИРОСТ - маленький
      let rageGain = 0;
      
      // БОНУС/ШТРАФ за скорость тапа
      const speedBonus = getTapSpeedBonus(timeDiff);
      rageGain += speedBonus;
      
      // Штраф за высокий уровень (сложнее расти на высоких уровнях)
      const levelPenalty = Math.max(0, 4 - Math.floor(rage / 20));
      rageGain += levelPenalty;
      
      // Минимальный прирост даже за медленные тапы
      rageGain = Math.max(rageGain, 0.3);
      
      rage = Math.min(rage + rageGain, 100);
      
      // ЗВУК
      playDamageSound();
      
      // ВСПЫШКА
      createFlash();
      
      // ПУЛЬСАЦИЯ
      const ripple = document.createElement('div');
      ripple.className = 'tap-ripple';
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      ripple.style.width = ripple.style.height = `${40 + rage}px`;
      
      const level = getCurrentLevel();
      ripple.style.borderColor = level.color;
      
      document.body.appendChild(ripple);
      setTimeout(() => ripple.remove(), 1000);
      
      // ВЫЛЕТАЮЩИЕ ЭЛЕМЕНТЫ (больше частиц при быстрых тапах)
      const particleMultiplier = 1 + (Math.max(speedBonus, 0) / 3);
      const baseParticles = Math.floor(1.5 * particleMultiplier);
      const particleCount = Math.min(baseParticles, 5);
      
      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          const offsetX = (Math.random() * 120 - 60);
          const offsetY = (Math.random() * 120 - 60);
          
          if (Math.random() > 0.4) {
            createParticle(x + offsetX, y + offsetY, false);
          }
          if (Math.random() > 0.5) {
            createParticle(x + offsetX, y + offsetY, true);
          }
        }, i * 60);
      }
      
      // ВИБРАЦИЯ
      if (navigator.vibrate) {
        const duration = Math.min(20 + rage / 3, 70);
        
        if (speedBonus > 6) {
          // Сильная вибрация за быстрые тапы
          navigator.vibrate(duration);
        } else if (speedBonus > 3) {
          // Средняя вибрация
          navigator.vibrate(duration * 0.7);
        } else if (speedBonus > 0) {
          // Слабая вибрация
          navigator.vibrate(duration * 0.4);
        }
      }
      
      updateUI();
      
      // ЗАПУСКАЕМ СБРОС
      startDecay();
    }
    
    // =================== ОБРАБОТЧИКИ ===================
    // Обработчик для мыши/тапа
    tapArea.addEventListener('mousedown', function(e) {
      e.preventDefault();
      handleTap(e.clientX, e.clientY);
    });
    
    tapArea.addEventListener('click', function(e) {
      e.preventDefault();
      handleTap(e.clientX, e.clientY);
    });
    
    // Обработчики для тач-устройств
    tapArea.addEventListener('touchstart', function(e) {
      e.preventDefault();
      if (isTouching) return;
      
      isTouching = true;
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
      
      // Сбрасываем флаг через небольшой интервал
      setTimeout(() => {
        isTouching = false;
      }, 40);
    }, { passive: false });
    
    tapArea.addEventListener('touchend', function(e) {
      e.preventDefault();
    }, { passive: false });
    
    // Блокируем контекстное меню на телефонах
    tapArea.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });
    
    // Предотвращаем масштабирование при быстрых тапах
    document.addEventListener('gesturestart', function(e) {
      e.preventDefault();
    });
    
    // =================== ИНИЦИАЛИЗАЦИЯ ===================
    updateUI();
    
    // Активируем тап-область при загрузке
    setTimeout(() => {
      tapArea.style.pointerEvents = 'auto';
    }, 100);
  </script>
</body>
</html>
