<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤬 КАТАРСИС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      width: 100vw;
    }
    
    .tap-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
    
    .progress-container {
      position: absolute;
      bottom: 90px;
      left: 30px;
      right: 30px;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .progress-bar {
      height: 100%;
      width: 0%;
      transition: width 0.2s ease-out, background-color 0.3s ease;
      border-radius: 5px;
    }
    
    .exit-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 35px;
      border-radius: 25px;
      font-size: 17px;
      z-index: 1002;
      cursor: pointer;
      backdrop-filter: blur(5px);
      border: none;
    }
    
    .particles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }
    
    .rage-particle {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      font-weight: 900;
      animation: particleFly 1.2s ease-out forwards;
      z-index: 6;
    }
    
    .rage-word {
      font-family: 'Arial Black', Impact, sans-serif;
      text-shadow: 
        0 0 15px currentColor,
        0 0 30px currentColor,
        2px 2px 5px rgba(0, 0, 0, 0.7);
    }
    
    .rage-emoji {
      text-shadow: 
        0 0 20px currentColor,
        0 0 40px currentColor;
    }
    
    @keyframes particleFly {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.8) rotate(0deg);
      }
      30% {
        opacity: 1;
        transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.7), calc(var(--dy) * 1.7)) scale(0.2) rotate(calc(var(--rot) * 2));
      }
    }
    
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: quickFlash 0.3s ease-out;
    }
    
    @keyframes quickFlash {
      0% { opacity: 0.8; }
      70% { opacity: 0.4; }
      100% { opacity: 0; }
    }
    
    .tap-hit {
      position: absolute;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 4;
      animation: tapExplode 0.6s ease-out forwards;
    }
    
    @keyframes tapExplode {
      0% { 
        transform: translate(-50%, -50%) scale(0); 
        opacity: 1; 
      }
      50% { 
        transform: translate(-50%, -50%) scale(2); 
        opacity: 0.7; 
      }
      100% { 
        transform: translate(-50%, -50%) scale(2.5); 
        opacity: 0; 
      }
    }
    
    .wave-effect {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 3;
      animation: waveExpand 0.7s ease-out forwards;
    }
    
    @keyframes waveExpand {
      0% { 
        transform: translate(-50%, -50%) scale(0);
        opacity: 0.8;
      }
      100% { 
        transform: translate(-50%, -50%) scale(3);
        opacity: 0;
      }
    }
    
    .spark {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 7;
      animation: sparkFly 0.9s ease-out forwards;
    }
    
    @keyframes sparkFly {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--spark-dx), var(--spark-dy)) scale(0);
        opacity: 0;
      }
    }
    
    .you-died-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .you-died-text {
      font-family: 'Times New Roman', serif;
      font-size: 14vw;
      color: #8B0000;
      text-shadow: 
        0 0 40px #8B0000,
        0 0 80px #8B0000,
        4px 4px 0 #000,
        7px 7px 0 rgba(0, 0, 0, 0.8);
      margin: 0;
      opacity: 0;
      animation: darkSoulsDeath 3.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      text-transform: uppercase;
      letter-spacing: 2vw;
      line-height: 1;
      text-align: center;
      padding: 0 5vw;
    }
    
    @keyframes darkSoulsDeath {
      0% { 
        opacity: 0;
        transform: scale(4);
        filter: blur(60px) brightness(6);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0) brightness(1);
      }
    }
    
    .critical-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #8B0000;
      opacity: 0;
      pointer-events: none;
      z-index: 900;
      animation: criticalFlash 2s ease-out;
    }
    
    @keyframes criticalFlash {
      0% { opacity: 0; }
      10% { opacity: 0.9; }
      25% { opacity: 0.7; }
      45% { opacity: 0.5; }
      70% { opacity: 0.3; }
      100% { opacity: 0; }
    }
    
    .start-instruction {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      z-index: 1;
      pointer-events: none;
      animation: pulseInstruction 2s infinite ease-in-out;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
      font-weight: 700;
      letter-spacing: 1px;
      background: rgba(0, 0, 0, 0.6);
      padding: 15px 25px;
      border-radius: 15px;
      backdrop-filter: blur(5px);
      .exit-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 35px;
      border-radius: 25px;
      font-size: 17px;
      z-index: 1002;
      cursor: pointer;
      backdrop-filter: blur(5px);
      white-space: nowrap;
      border: none;
    }
    
    @keyframes pulseInstruction {
      0% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
      100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>
<body>
  <div class="particles-container" id="particlesContainer"></div>
  <div class="tap-area" id="tapArea"></div>
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  
  <div class="start-instruction" id="startInstruction">
    👆 ЖМИ НА ЭКРАН!
  </div>
  
  <button class="exit-btn" onclick="Telegram.WebApp.close()">✖ ЗАКРЫТЬ</button>
  <div class="you-died-overlay" id="youDiedOverlay">
    <div class="you-died-text">YOU DIED</div>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    if (Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
    }
    
    let rage = 0;
    let gameActive = true;
    let youDiedShown = false;
    let decayInterval = null;
    let lastSoundTime = 0;
    let isProcessingTap = false;
    let tapTimeout = null;
    let firstTapDone = false;
    
    const WORDS = ["ПИЗДА!", "СУКА!", "ЕБАТЬ!", "НАХУЙ!", "БЛЯТЬ!", "ХУЙ!", "ЗАЛУПА!", "ПИЗДЕЦ!", "ЗАЕБАЛО!", "ЖОПА!"];
    const EMOJIS = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡", "☠️"];
    
    const PROGRESS_COLORS = [
      '#ffffff',    // Белый
      '#ffcccc',    // Очень светлый красный
      '#ff9999',    // Светлый красный
      '#ff6666',    // Красный
      '#ff3333',    // Яркий красный
      '#ff0000',    // Чистый красный
      '#cc0000',    // Темный красный
      '#8b0000'     // Кровавый красный
    ];
    
    const tapArea = document.getElementById('tapArea');
    const progressBar = document.getElementById('progressBar');
    const youDiedOverlay = document.getElementById('youDiedOverlay');
    const particlesContainer = document.getElementById('particlesContainer');
    const startInstruction = document.getElementById('startInstruction');
    
    let damageAudio = null;
    let deathAudio = null;
    let soundInitialized = false;
    
    function initSound() {
      if (soundInitialized) return;
      
      damageAudio = new Audio();
      damageAudio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
      damageAudio.preload = "auto";
      damageAudio.volume = 0.25;
      
      deathAudio = new Audio();
      deathAudio.src = "https://veedva.github.io/weedkent_bot/dark-souls-you-died.mp3";
      deathAudio.preload = "auto";
      deathAudio.volume = 0.8;
      
      soundInitialized = true;
    }
    
    function playDamageSound() {
      if (!damageAudio) return;
      if (Math.random() > 0.2) return;
      
      const now = Date.now();
      if (now - lastSoundTime < 400) return;
      lastSoundTime = now;
      
      try {
        damageAudio.currentTime = 0;
        damageAudio.volume = 0.2 + (rage / 700);
        damageAudio.play().catch(() => {});
      } catch (e) {}
    }
    
    function playDeathSound() {
      if (!deathAudio) return;
      
      setTimeout(() => {
        try {
          deathAudio.currentTime = 0;
          deathAudio.play().catch(() => {});
        } catch (e) {}
      }, 400);
    }
    
    function getProgressColor() {
      if (rage < 20) return PROGRESS_COLORS[0];
      if (rage < 40) return PROGRESS_COLORS[1];
      if (rage < 50) return PROGRESS_COLORS[2];
      if (rage < 60) return PROGRESS_COLORS[3];
      if (rage < 80) return PROGRESS_COLORS[4];
      if (rage < 90) return PROGRESS_COLORS[5];
      if (rage < 95) return PROGRESS_COLORS[6];
      return PROGRESS_COLORS[7];
    }
    
    function updateUI() {
      progressBar.style.width = `${Math.min(rage, 100)}%`;
      progressBar.style.backgroundColor = getProgressColor();
    }
    
    function createParticle(x, y, isEmoji) {
      const particle = document.createElement('div');
      particle.className = `rage-particle ${isEmoji ? 'rage-emoji' : 'rage-word'}`;
      particle.textContent = isEmoji 
        ? EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
        : WORDS[Math.floor(Math.random() * WORDS.length)];
      
      const intensity = Math.min(rage / 100, 1);
      const baseSize = isEmoji ? 40 : 32;
      const fontSize = Math.floor(baseSize * (0.9 + intensity * 0.6));
      particle.style.fontSize = `${fontSize}px`;
      
      const basePower = 100 + (intensity * 150);
      const angle = Math.random() * Math.PI * 2;
      const dx = Math.cos(angle) * basePower;
      const dy = Math.sin(angle) * basePower * 0.8;
      const rotation = Math.random() * 180 - 90;
      
      particle.style.setProperty('--dx', `${dx}px`);
      particle.style.setProperty('--dy', `${dy}px`);
      particle.style.setProperty('--rot', `${rotation}deg`);
      
      const offsetX = (Math.random() * 30 - 15);
      const offsetY = (Math.random() * 30 - 15);
      particle.style.left = `${x + offsetX}px`;
      particle.style.top = `${y + offsetY}px`;
      particle.style.color = getProgressColor();
      
      particlesContainer.appendChild(particle);
      
      setTimeout(() => {
        if (particle.parentNode) particle.remove();
      }, 1200);
      
      const particles = particlesContainer.querySelectorAll('.rage-particle');
      if (particles.length > 20) {
        particles[0].remove();
      }
    }
    
    function createWave(x, y) {
      const wave = document.createElement('div');
      wave.className = 'wave-effect';
      wave.style.left = `${x}px`;
      wave.style.top = `${y}px`;
      wave.style.borderColor = getProgressColor();
      document.body.appendChild(wave);
      setTimeout(() => wave.remove(), 700);
    }
    
    function createSparks(x, y, count) {
      for (let i = 0; i < count; i++) {
        const spark = document.createElement('div');
        spark.className = 'spark';
        spark.style.left = `${x}px`;
        spark.style.top = `${y}px`;
        spark.style.background = getProgressColor();
        
        const angle = Math.random() * Math.PI * 2;
        const distance = 50 + Math.random() * 100;
        spark.style.setProperty('--spark-dx', `${Math.cos(angle) * distance}px`);
        spark.style.setProperty('--spark-dy', `${Math.sin(angle) * distance}px`);
        
        document.body.appendChild(spark);
        setTimeout(() => spark.remove(), 900);
      }
    }
    
    function createTapHit(x, y) {
      const hit = document.createElement('div');
      hit.className = 'tap-hit';
      hit.style.left = `${x}px`;
      hit.style.top = `${y}px`;
      hit.style.background = `radial-gradient(circle, ${getProgressColor()} 0%, rgba(255,255,255,0.8) 30%, transparent 70%)`;
      document.body.appendChild(hit);
      setTimeout(() => hit.remove(), 600);
    }
    
    function createFlash() {
      const flash = document.createElement('div');
      flash.className = 'screen-flash';
      const intensity = Math.min(rage / 100, 1);
      const opacity = 0.2 + (intensity * 0.3);
      const color = getProgressColor().replace(')', `, ${opacity})`).replace('#', 'rgba(');
      flash.style.background = color;
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 300);
    }
    
    function createEffects(x, y) {
      createTapHit(x, y);
      createFlash();
      createWave(x, y);
      
      const intensity = Math.min(rage / 100, 1);
      const sparkCount = 3 + Math.floor(intensity * 6);
      
      createSparks(x, y, sparkCount);
      
      const particleCount = 2 + Math.floor(rage / 25);
      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          const offsetX = (Math.random() * 40 - 20);
          const offsetY = (Math.random() * 40 - 20);
          createParticle(x + offsetX, y + offsetY, Math.random() > 0.5);
        }, i * 60);
      }
      
      if (navigator.vibrate) {
        const duration = Math.min(20, 8 + Math.floor(rage / 10));
        navigator.vibrate(duration);
      }
    }
    
    function showDeathScreen() {
      youDiedShown = true;
      gameActive = false;
      tapArea.style.pointerEvents = 'none';
      
      progressBar.style.width = '100%';
      progressBar.style.backgroundColor = PROGRESS_COLORS[7];
      
      const flash = document.createElement('div');
      flash.className = 'critical-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 2000);
      
      playDeathSound();
      
      if (navigator.vibrate) {
        navigator.vibrate([500, 200, 500]);
      }
      
      setTimeout(() => {
        youDiedOverlay.style.display = 'flex';
        progressBar.parentElement.style.display = 'none';
      }, 600);
    }
    
    function startDecay() {
      if (decayInterval) clearInterval(decayInterval);
      
      decayInterval = setInterval(() => {
        if (rage > 0 && gameActive) {
          rage = Math.max(0, rage - 0.7);
          updateUI();
        }
      }, 100);
    }
    
    function handleTapEvent(e) {
      e.preventDefault();
      
      if (!gameActive || isProcessingTap) return;
      
      // Убираем инструкцию МГНОВЕННО
      if (!firstTapDone) {
        startInstruction.style.display = 'none';
        firstTapDone = true;
      }
      
      isProcessingTap = true;
      clearTimeout(tapTimeout);
      tapTimeout = setTimeout(() => { isProcessingTap = false; }, 100);
      
      const clientX = e.clientX;
      const clientY = e.clientY;
      
      if (!soundInitialized) initSound();
      
      rage = Math.min(rage + 5, 100);
      updateUI();
      
      if (rage >= 100 && !youDiedShown) {
        setTimeout(() => {
          showDeathScreen();
        }, 80);
        
        isProcessingTap = false;
        return;
      }
      
      playDamageSound();
      createEffects(clientX, clientY);
    }
    
    tapArea.addEventListener('pointerdown', handleTapEvent, { passive: false });
    
    updateUI();
    startDecay();
    
    setInterval(() => {
      const particles = particlesContainer.querySelectorAll('.rage-particle');
      if (particles.length > 25) {
        const toRemove = particles.length - 20;
        for (let i = 0; i < toRemove; i++) {
          if (particles[i]) particles[i].remove();
        }
      }
    }, 3000);
  </script>
</body>
</html>
