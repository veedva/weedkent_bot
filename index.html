<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤬 КАТАРСИС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      width: 100vw;
    }
    
    .tap-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 1;
      cursor: pointer;
    }
    
    .progress-container {
      position: absolute;
      bottom: 90px;
      left: 30px;
      right: 30px;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .progress-bar {
      height: 100%;
      width: 0%;
      transition: width 0.15s ease-out, background-color 0.3s ease;
      border-radius: 5px;
    }
    
    .exit-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 35px;
      border-radius: 25px;
      font-size: 17px;
      z-index: 1002;
      cursor: pointer;
      backdrop-filter: blur(5px);
      border: none;
    }
    
    .particles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }
    
    .rage-particle {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      font-weight: 900;
      animation: particleFloat 1.2s ease-out forwards;
    }
    
    .rage-word {
      font-family: 'Arial Black', Impact, sans-serif;
      text-shadow: 0 0 12px currentColor;
    }
    
    .rage-emoji {
      text-shadow: 0 0 16px currentColor;
    }
    
    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.9);
      }
      40% {
        opacity: 1;
        transform: translate(var(--dx), var(--dy)) scale(1.3);
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.2), calc(var(--dy) * 1.2)) scale(0.3);
      }
    }
    
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: quickFlash 0.25s ease-out;
    }
    
    @keyframes quickFlash {
      0% { opacity: 0.6; }
      100% { opacity: 0; }
    }
    
    .tap-hit {
      position: absolute;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 4;
      animation: tapHitEffect 0.35s ease-out forwards;
    }
    
    @keyframes tapHitEffect {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1.4); opacity: 0.5; }
      100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
    }
    
    .you-died-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .you-died-text {
      font-family: 'Times New Roman', serif;
      font-size: 14vw;
      color: #8B0000;
      text-shadow: 
        0 0 30px #8B0000,
        0 0 60px #8B0000,
        3px 3px 0 #000;
      margin: 0;
      opacity: 0;
      animation: darkSoulsDeath 3s ease-out forwards;
      text-transform: uppercase;
      letter-spacing: 2vw;
      line-height: 1;
      text-align: center;
      padding: 0 5vw;
    }
    
    @keyframes darkSoulsDeath {
      0% { 
        opacity: 0;
        transform: scale(3);
        filter: blur(50px);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }
    }
    
    .critical-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #8B0000;
      opacity: 0;
      pointer-events: none;
      z-index: 900;
      animation: criticalFlash 1.5s ease-out;
    }
    
    @keyframes criticalFlash {
      0% { opacity: 0; }
      5% { opacity: 0.8; }
      30% { opacity: 0.5; }
      70% { opacity: 0.2; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="particles-container" id="particlesContainer"></div>
  <div class="tap-area" id="tapArea"></div>
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <button class="exit-btn" onclick="Telegram.WebApp.close()">✖ ЗАКРЫТЬ</button>
  <div class="you-died-overlay" id="youDiedOverlay">
    <div class="you-died-text">YOU DIED</div>
  </div>

  <script>
    // === ИНИЦИАЛИЗАЦИЯ ===
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    if (Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
    }
    
    // === ПЕРЕМЕННЫЕ ===
    let rage = 0;
    let gameActive = true;
    let youDiedShown = false;
    let decayInterval = null;
    let lastSoundTime = 0;
    
    // === ДАННЫЕ ===
    const WORDS = ["ПИЗДА!", "СУКА!", "ЕБАТЬ!", "НАХУЙ!", "БЛЯТЬ!", "ХУЙ!", "ПИЗДЕЦ!", "ОХУЕТЬ!"];
    const EMOJIS = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡", "☠️"];
    
    const PROGRESS_COLORS = [
      '#4dabf7',   // Синий
      '#38bdf8',   // Голубой
      '#22d3ee',   // Бирюзовый
      '#fbbf24',   // Желтый
      '#f97316',   // Оранжевый
      '#ef4444',   // Красный
      '#dc2626',   // Ярко-красный
      '#991b1b'    // Темно-красный
    ];
    
    // === DOM ЭЛЕМЕНТЫ ===
    const tapArea = document.getElementById('tapArea');
    const progressBar = document.getElementById('progressBar');
    const youDiedOverlay = document.getElementById('youDiedOverlay');
    const particlesContainer = document.getElementById('particlesContainer');
    
    // === АУДИО ===
    let damageAudio = null;
    let deathAudio = null;
    let soundInitialized = false;
    
    function initSound() {
      if (soundInitialized) return;
      
      damageAudio = new Audio();
      damageAudio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
      damageAudio.preload = "auto";
      damageAudio.volume = 0.2;
      
      deathAudio = new Audio();
      deathAudio.src = "https://veedva.github.io/weedkent_bot/dark-souls-you-died.mp3";
      deathAudio.preload = "auto";
      deathAudio.volume = 0.8;
      
      soundInitialized = true;
    }
    
    function playDamageSound() {
      if (!damageAudio) return;
      
      // Звук только 15% кликов
      if (Math.random() > 0.15) return;
      
      // Не чаще чем раз в 300мс
      const now = Date.now();
      if (now - lastSoundTime < 300) return;
      lastSoundTime = now;
      
      try {
        damageAudio.currentTime = 0;
        damageAudio.volume = 0.15 + (rage / 800); // Очень тихо
        damageAudio.play().catch(() => {});
      } catch (e) {}
    }
    
    function playDeathSound() {
      if (!deathAudio) return;
      
      setTimeout(() => {
        try {
          deathAudio.currentTime = 0;
          deathAudio.play().catch(() => {});
        } catch (e) {}
      }, 400);
    }
    
    // === ОСНОВНЫЕ ФУНКЦИИ ===
    function getProgressColor() {
      if (rage < 20) return PROGRESS_COLORS[0];
      if (rage < 40) return PROGRESS_COLORS[1];
      if (rage < 50) return PROGRESS_COLORS[2];
      if (rage < 60) return PROGRESS_COLORS[3];
      if (rage < 80) return PROGRESS_COLORS[4];
      if (rage < 90) return PROGRESS_COLORS[5];
      if (rage < 95) return PROGRESS_COLORS[6];
      return PROGRESS_COLORS[7];
    }
    
    function updateUI() {
      progressBar.style.width = `${Math.min(rage, 100)}%`;
      progressBar.style.backgroundColor = getProgressColor();
    }
    
    function createParticle(x, y, isEmoji) {
      const particle = document.createElement('div');
      particle.className = `rage-particle ${isEmoji ? 'rage-emoji' : 'rage-word'}`;
      particle.textContent = isEmoji 
        ? EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
        : WORDS[Math.floor(Math.random() * WORDS.length)];
      
      const intensity = Math.min(rage / 100, 1);
      const fontSize = isEmoji ? 36 : 28;
      particle.style.fontSize = `${fontSize}px`;
      
      const distance = 70 + (intensity * 60);
      const angle = Math.random() * Math.PI * 2;
      
      particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
      particle.style.setProperty('--dy', `${Math.sin(angle) * distance * 0.7}px`);
      
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      particle.style.color = getProgressColor();
      
      particlesContainer.appendChild(particle);
      
      setTimeout(() => {
        if (particle.parentNode) particle.remove();
      }, 1200);
    }
    
    function createEffects(x, y) {
      // Точка удара
      const hit = document.createElement('div');
      hit.className = 'tap-hit';
      hit.style.left = `${x}px`;
      hit.style.top = `${y}px`;
      hit.style.background = `radial-gradient(circle, ${getProgressColor()} 0%, transparent 70%)`;
      document.body.appendChild(hit);
      setTimeout(() => hit.remove(), 350);
      
      // Вспышка
      const flash = document.createElement('div');
      flash.className = 'screen-flash';
      flash.style.background = getProgressColor().replace(')', `, 0.2)`).replace('#', 'rgba(');
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 250);
      
      // Частицы
      const count = rage > 70 ? 3 : (rage > 40 ? 2 : 1);
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const offsetX = (Math.random() * 40 - 20);
          const offsetY = (Math.random() * 40 - 20);
          createParticle(x + offsetX, y + offsetY, Math.random() > 0.5);
        }, i * 60);
      }
    }
    
    function showDeathScreen() {
      youDiedShown = true;
      gameActive = false;
      
      // Критическая вспышка
      const flash = document.createElement('div');
      flash.className = 'critical-flash';
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 1500);
      
      // Звук смерти
      playDeathSound();
      
      // Вибрация
      if (navigator.vibrate) {
        navigator.vibrate([400, 100, 400]);
      }
      
      // YOU DIED экран
      setTimeout(() => {
        youDiedOverlay.style.display = 'flex';
        progressBar.parentElement.style.display = 'none';
      }, 200);
    }
    
    // === СИСТЕМА ЯРОСТИ ===
    function startDecay() {
      if (decayInterval) clearInterval(decayInterval);
      
      decayInterval = setInterval(() => {
        if (rage > 0 && gameActive) {
          rage = Math.max(0, rage - 0.8);
          updateUI();
        }
      }, 100);
    }
    
    function handleTap(x, y) {
      if (!gameActive) return;
      
      // Инициализация звука при первом тапе
      if (!soundInitialized) initSound();
      
      // Проверка на смерть
      if (rage >= 100) {
        if (!youDiedShown) showDeathScreen();
        return;
      }
      
      // Увеличение ярости
      rage = Math.min(rage + 3.5, 100);
      
      // Звук удара (редко)
      playDamageSound();
      
      // Визуальные эффекты
      createEffects(x, y);
      
      // Обновление UI
      updateUI();
      
      // Перезапуск убывания
      if (decayInterval) {
        clearInterval(decayInterval);
        startDecay();
      }
    }
    
    // === ОБРАБОТЧИКИ ===
    tapArea.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });
    
    tapArea.addEventListener('click', (e) => {
      handleTap(e.clientX, e.clientY);
    });
    
    // === ЗАПУСК ===
    updateUI();
    startDecay();
    
    // Очистка частиц
    setInterval(() => {
      const particles = particlesContainer.querySelectorAll('.rage-particle');
      if (particles.length > 12) {
        particles[0].remove();
      }
    }, 2000);
  </script>
</body>
</html>
