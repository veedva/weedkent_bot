<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🤬 БЕСКОНЕЧНЫЙ КАТАРСИС</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-user-select: none !important;
      user-select: none !important;
      touch-action: manipulation !important;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #000;
      color: white;
      height: 100vh;
      width: 100vw;
      -webkit-font-smoothing: antialiased;
    }
    
    /* ЭКРАН ДЛЯ ТАПОВ */
    .tap-area {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 1;
      cursor: pointer;
      touch-action: manipulation;
    }
    
    /* ПРОГРЕСС БАР - ТОЛЬКО ШКАЛА */
    .progress-container {
      position: absolute;
      bottom: 90px;
      left: 30px;
      right: 30px;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      z-index: 10;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .progress-bar {
      height: 100%;
      width: 0%;
      transition: width 0.1s linear, background-color 0.3s ease;
      border-radius: 5px;
    }
    
    /* КНОПКА ВЫХОДА */
    .exit-btn {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.15);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 14px 35px;
      border-radius: 25px;
      font-size: 17px;
      z-index: 1002;
      cursor: pointer;
      backdrop-filter: blur(5px);
      -webkit-appearance: none;
      border: none;
    }
    
    /* КОНТЕЙНЕР ДЛЯ ЧАСТИЦ */
    .particles-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
      contain: strict;
    }
    
    /* ВЫЛЕТАЮЩИЕ СЛОВА - УСИЛЕННЫЙ РАЗЛЕТ */
    .rage-particle {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      font-weight: 900;
      animation: particleFloat 1.5s ease-out forwards;
      will-change: transform, opacity;
    }
    
    .rage-word {
      font-family: 'Arial Black', Impact, sans-serif;
      letter-spacing: 1px;
      text-shadow: 0 0 15px currentColor, 0 0 30px rgba(255, 255, 255, 0.3);
    }
    
    .rage-emoji {
      text-shadow: 0 0 20px currentColor, 0 0 40px rgba(255, 255, 255, 0.4);
    }
    
    @keyframes particleFloat {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(0.9) rotate(0deg);
      }
      30% {
        opacity: 1;
        transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(var(--rot));
      }
      100% {
        opacity: 0;
        transform: translate(calc(var(--dx) * 1.5), calc(var(--dy) * 1.5)) scale(0.2);
      }
    }
    
    /* ВСПЫШКА ЭКРАНА */
    .screen-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      animation: quickFlash 0.3s ease-out;
      will-change: opacity;
    }
    
    @keyframes quickFlash {
      0% { opacity: 0.8; }
      100% { opacity: 0; }
    }
    
    /* ТОЧКА УДАРА */
    .tap-hit {
      position: absolute;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 4;
      animation: tapHitEffect 0.4s ease-out forwards;
      will-change: transform, opacity;
    }
    
    @keyframes tapHitEffect {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
      70% { transform: translate(-50%, -50%) scale(1.5); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    }
    
    /* YOU DIED ЭКРАН */
    .you-died-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: none;
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    
    .you-died-text {
      font-family: 'Times New Roman', serif;
      font-size: 14vw;
      color: #8B0000;
      text-shadow: 
        0 0 30px #8B0000,
        0 0 60px #8B0000,
        0 0 90px #8B0000,
        3px 3px 0 #000,
        5px 5px 0 rgba(0, 0, 0, 0.8);
      margin: 0;
      opacity: 0;
      animation: darkSoulsDeath 4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
      text-transform: uppercase;
      letter-spacing: 2vw;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      padding: 0 5vw;
      max-width: 100%;
      transform-origin: center center;
    }
    
    @media (max-width: 400px) {
      .you-died-text {
        font-size: 56px;
        letter-spacing: 8px;
      }
    }
    
    @media (min-width: 800px) {
      .you-died-text {
        font-size: 112px;
        letter-spacing: 16px;
      }
    }
    
    @keyframes darkSoulsDeath {
      0% { 
        opacity: 0;
        transform: scale(3);
        filter: blur(50px) brightness(5);
      }
      10% {
        opacity: 0.1;
        transform: scale(2.8);
        filter: blur(40px) brightness(4.5);
      }
      20% {
        opacity: 0.2;
        transform: scale(2.5);
        filter: blur(35px) brightness(4);
      }
      30% {
        opacity: 0.3;
        transform: scale(2.2);
        filter: blur(30px) brightness(3.5);
      }
      40% {
        opacity: 0.4;
        transform: scale(1.9);
        filter: blur(25px) brightness(3);
      }
      50% {
        opacity: 0.5;
        transform: scale(1.6);
        filter: blur(20px) brightness(2.5);
      }
      60% {
        opacity: 0.6;
        transform: scale(1.3);
        filter: blur(15px) brightness(2);
      }
      70% {
        opacity: 0.7;
        transform: scale(1.15);
        filter: blur(10px) brightness(1.8);
      }
      80% {
        opacity: 0.8;
        transform: scale(1.07);
        filter: blur(5px) brightness(1.4);
      }
      90% {
        opacity: 0.9;
        transform: scale(1.02);
        filter: blur(2px) brightness(1.2);
      }
      100% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0) brightness(1);
      }
    }
    
    /* КРИТИЧЕСКАЯ ВСПЫШКА */
    .critical-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #8B0000;
      opacity: 0;
      pointer-events: none;
      z-index: 900;
      animation: criticalFlash 1.5s ease-out;
      will-change: opacity;
    }
    
    @keyframes criticalFlash {
      0% { opacity: 0; }
      5% { opacity: 0.8; }
      15% { opacity: 0.7; }
      30% { opacity: 0.5; }
      50% { opacity: 0.3; }
      70% { opacity: 0.15; }
      90% { opacity: 0.05; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- Контейнер для частиц -->
  <div class="particles-container" id="particlesContainer"></div>
  
  <!-- Область для тапов -->
  <div class="tap-area" id="tapArea"></div>
  
  <!-- Прогресс-бар (без надписей) -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  
  <!-- Кнопка выхода -->
  <button class="exit-btn" onclick="Telegram.WebApp.close()">✖ ЗАКРЫТЬ</button>
  
  <!-- YOU DIED ЭКРАН -->
  <div class="you-died-overlay" id="youDiedOverlay">
    <div class="you-died-text">YOU DIED</div>
  </div>

  <script>
    // =================== ТЕЛЕГРАМ ===================
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    
    if (Telegram.WebApp.BackButton) {
      Telegram.WebApp.BackButton.show();
      Telegram.WebApp.BackButton.onClick(() => Telegram.WebApp.close());
    }
    
    // =================== ДАННЫЕ ===================
    let rage = 0;
    let soundEnabled = false;
    let soundInitialized = false;
    let soundCooldown = false;
    let audioElements = [];
    let youDiedSound = null;
    let currentAudioIndex = 0;
    let firstTapDone = false;
    let youDiedShown = false;
    let decayTimer = null;
    let gameActive = true;
    let isProcessingTap = false; // ЗАЩИТА ОТ ДВОЙНЫХ КЛИКОВ
    
    // Слова и эмодзи
    const WORDS = [
      "ПИЗДА!", "СУКА!", "ЕБАТЬ!", "НАХУЙ!", "БЛЯТЬ!", "ХУЙ!", 
      "ПИЗДОС!", "ОХУЕТЬ!", "ЗАЕБАЛО!", "ПОШЛИ НАХУЙ!", "ЁПТА!", 
      "БЛЯДЬ!", "УЁБИЩЕ!", "ТВАРЬ!", "ПИЗДЕЦ!", "ЗАЛУПА!", "МРАЗЬ!"
    ];
    const EMOJIS = ["💩", "🤬", "😡", "👿", "💢", "🔥", "💥", "⚡", "🌪", "☠️", "💣", "🧨"];
    
    // ЦВЕТА ДЛЯ ПРОГРЕСС-БАРА (от холодных к горячим)
    const PROGRESS_COLORS = [
      '#4dabf7',   // Холодный синий (0-20%)
      '#38bdf8',   // Голубой (20-40%)
      '#22d3ee',   // Бирюзовый (40-50%)
      '#fbbf24',   // Теплый желтый (50-60%)
      '#f97316',   // Оранжевый (60-80%)
      '#ef4444',   // Красный (80-90%)
      '#dc2626',   // Ярко-красный (90-95%)
      '#991b1b'    // Темно-красный (95-100%)
    ];
    
    // =================== DOM ===================
    const tapArea = document.getElementById('tapArea');
    const progressBar = document.getElementById('progressBar');
    const youDiedOverlay = document.getElementById('youDiedOverlay');
    const particlesContainer = document.getElementById('particlesContainer');
    
    // =================== ЗВУК ===================
    function initSoundOnFirstTap() {
      if (soundInitialized) return;
      
      for (let i = 0; i < 3; i++) {
        const audio = new Audio();
        audio.src = "https://veedva.github.io/weedkent_bot/damage.mp3";
        audio.preload = "auto";
        audio.volume = 0.5;
        audioElements.push(audio);
      }
      
      youDiedSound = new Audio();
      youDiedSound.src = "https://veedva.github.io/weedkent_bot/dark-souls-you-died.mp3";
      youDiedSound.preload = "auto";
      youDiedSound.volume = 0.8;
      
      soundInitialized = true;
      soundEnabled = true;
    }
    
    function playDamageSound() {
      if (!soundEnabled || soundCooldown) return;
      
      // Вероятность звука зависит от уровня ярости
      const soundChance = 0.1 + (rage / 100) * 0.25;
      if (Math.random() > soundChance) return;
      
      try {
        const audio = audioElements[currentAudioIndex];
        currentAudioIndex = (currentAudioIndex + 1) % audioElements.length;
        
        audio.currentTime = 0;
        audio.volume = 0.4 + (rage / 300);
        audio.play().catch(() => {});
        
        soundCooldown = true;
        setTimeout(() => { soundCooldown = false; }, 150);
      } catch (error) {}
    }
    
    function playYouDiedSound() {
      if (!soundEnabled || !youDiedSound) return;
      
      try {
        setTimeout(() => {
          youDiedSound.currentTime = 0;
          youDiedSound.volume = 0.8;
          youDiedSound.play().catch(() => {});
        }, 400);
      } catch (error) {}
    }
    
    // =================== ОСНОВНЫЕ ФУНКЦИИ ===================
    function getProgressColor() {
      const percent = rage;
      if (percent < 20) return PROGRESS_COLORS[0];
      if (percent < 40) return PROGRESS_COLORS[1];
      if (percent < 50) return PROGRESS_COLORS[2];
      if (percent < 60) return PROGRESS_COLORS[3];
      if (percent < 80) return PROGRESS_COLORS[4];
      if (percent < 90) return PROGRESS_COLORS[5];
      if (percent < 95) return PROGRESS_COLORS[6];
      return PROGRESS_COLORS[7];
    }
    
    function updateUI() {
      const ragePercent = Math.min(rage, 100);
      progressBar.style.width = `${ragePercent}%`;
      progressBar.style.backgroundColor = getProgressColor();
    }
    
    function createTapHit(x, y) {
      const hit = document.createElement('div');
      hit.className = 'tap-hit';
      hit.style.left = `${x}px`;
      hit.style.top = `${y}px`;
      hit.style.background = `radial-gradient(circle, ${getProgressColor()} 0%, transparent 70%)`;
      
      document.body.appendChild(hit);
      setTimeout(() => {
        if (hit.parentNode) hit.remove();
      }, 400);
    }
    
    function createParticle(x, y, isEmoji) {
      const particle = document.createElement('div');
      particle.className = `rage-particle ${isEmoji ? 'rage-emoji' : 'rage-word'}`;
      particle.textContent = isEmoji 
        ? EMOJIS[Math.floor(Math.random() * EMOJIS.length)]
        : WORDS[Math.floor(Math.random() * WORDS.length)];
      
      const intensity = Math.min(rage / 100, 1);
      
      // БОЛЬШИЕ РАЗМЕРЫ
      const baseSize = isEmoji ? 40 : 32;
      const sizeMultiplier = 0.9 + (intensity * 0.8);
      const fontSize = Math.floor(baseSize * sizeMultiplier);
      particle.style.fontSize = `${fontSize}px`;
      
      // СИЛЬНЫЙ РАЗЛЕТ - больше расстояние
      const baseDistance = 80 + (intensity * 100); // От 80 до 180 пикселей
      
      const angle = Math.random() * Math.PI * 2;
      const distance = baseDistance;
      
      // УСИЛЕННЫЕ ПАРАМЕТРЫ
      particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
      particle.style.setProperty('--dy', `${Math.sin(angle) * distance * 0.7}px`);
      particle.style.setProperty('--rot', `${Math.random() * 60 - 30}deg`);
      particle.style.setProperty('--scale', sizeMultiplier);
      
      particle.style.left = `${x}px`;
      particle.style.top = `${y}px`;
      
      // Цвет частицы
      particle.style.color = getProgressColor();
      
      particlesContainer.appendChild(particle);
      
      // Удаляем через 1.5 секунды
      setTimeout(() => {
        if (particle.parentNode) {
          particle.remove();
        }
      }, 1500);
      
      // Ограничиваем количество частиц
      const particles = particlesContainer.querySelectorAll('.rage-particle');
      if (particles.length > 15) {
        particles[0].remove();
      }
    }
    
    function createFlash() {
      const flash = document.createElement('div');
      flash.className = 'screen-flash';
      
      const intensity = Math.min(rage / 100, 1);
      const opacity = 0.2 + (intensity * 0.3);
      const color = getProgressColor().replace(')', `, ${opacity})`).replace('#', 'rgba(');
      
      flash.style.background = color;
      
      document.body.appendChild(flash);
      setTimeout(() => {
        if (flash.parentNode) flash.remove();
      }, 300);
    }
    
    function createCriticalFlash() {
      const flash = document.createElement('div');
      flash.className = 'critical-flash';
      document.body.appendChild(flash);
      setTimeout(() => {
        if (flash.parentNode) flash.remove();
      }, 1500);
    }
    
    function showYouDied() {
      if (youDiedShown) return;
      youDiedShown = true;
      gameActive = false;
      
      tapArea.style.pointerEvents = 'none';
      
      createCriticalFlash();
      playYouDiedSound();
      
      if (navigator.vibrate) {
        navigator.vibrate([500, 150, 500]);
      }
      
      setTimeout(() => {
        youDiedOverlay.style.display = 'flex';
        progressBar.parentElement.style.display = 'none';
      }, 250);
    }
    
    // СБРОС ЯРОСТИ
    function startDecay() {
      if (decayTimer) clearTimeout(decayTimer);
      
      decayTimer = setTimeout(() => {
        if (rage > 0) {
          const decayRate = 1.5 + (rage / 40);
          rage = Math.max(rage - decayRate, 0);
          
          if (gameActive) {
            updateUI();
          }
          
          if (rage > 0) {
            startDecay();
          }
        }
      }, 100);
    }
    
    function handleTap(x, y) {
      // ЗАЩИТА ОТ ДВОЙНЫХ КЛИКОВ
      if (!gameActive || isProcessingTap) return;
      isProcessingTap = true;
      
      setTimeout(() => {
        isProcessingTap = false;
      }, 100);
      
      if (!firstTapDone) {
        firstTapDone = true;
        initSoundOnFirstTap();
      }
      
      // Проверяем достижение 100%
      if (rage >= 100) {
        if (!youDiedShown) {
          showYouDied();
        }
        isProcessingTap = false;
        return;
      }
      
      // Увеличиваем ярость
      let rageGain = 4; // Немного больше для лучшей обратной связи
      rage = Math.min(rage + rageGain, 100);
      
      // Звук
      playDamageSound();
      
      // Визуальные эффекты
      createTapHit(x, y);
      createFlash();
      
      // БОЛЬШЕ ЧАСТИЦ С СИЛЬНЫМ РАЗЛЕТОМ
      const particleCount = rage > 70 ? 4 : (rage > 40 ? 3 : 2);
      
      for (let i = 0; i < particleCount; i++) {
        setTimeout(() => {
          const offsetX = (Math.random() * 50 - 25);
          const offsetY = (Math.random() * 50 - 25);
          
          createParticle(x + offsetX, y + offsetY, Math.random() > 0.5);
        }, i * 50);
      }
      
      // Вибрация
      if (navigator.vibrate) {
        const intensity = Math.min(rage / 100, 1);
        const duration = Math.floor(10 + intensity * 20);
        navigator.vibrate(duration);
      }
      
      updateUI();
      startDecay();
    }
    
    // =================== ОБРАБОТЧИКИ ===================
    // ПРЕДОТВРАЩАЕМ ДВОЙНЫЕ КЛИКИ НА МОБИЛЬНЫХ
    let lastTouchTime = 0;
    
    tapArea.addEventListener('touchstart', function(e) {
      e.preventDefault();
      const now = Date.now();
      
      // Защита от слишком быстрых касаний
      if (now - lastTouchTime < 100) return;
      lastTouchTime = now;
      
      const touch = e.touches[0];
      handleTap(touch.clientX, touch.clientY);
    }, { passive: false });
    
    // Для десктопов - обычный клик
    tapArea.addEventListener('click', function(e) {
      const now = Date.now();
      if (now - lastTouchTime < 100) return; // Игнорируем если был недавний touch
      handleTap(e.clientX, e.clientY);
    });
    
    // =================== ИНИЦИАЛИЗАЦИЯ ===================
    updateUI();
    startDecay();
    
    // Автоматическая очистка старых частиц
    setInterval(() => {
      const particles = particlesContainer.querySelectorAll('.rage-particle');
      if (particles.length > 20) {
        const toRemove = particles.length - 15;
        for (let i = 0; i < toRemove; i++) {
          if (particles[i]) {
            particles[i].remove();
          }
        }
      }
    }, 3000);
    
    document.addEventListener('visibilitychange', function() {
      if (document.hidden) {
        const particles = particlesContainer.querySelectorAll('.rage-particle');
        particles.forEach(p => p.remove());
      }
    });
  </script>
</body>
</html>
